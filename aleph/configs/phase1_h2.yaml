# Phase 1 — Unit H.2 single-filament L_p validation (HOOMD runtime) defaults.
#
# Single 10 μm actin filament (no cross-links, no LJ pair) under BAOAB
# Brownian dynamics; measure tangent-tangent correlation ⟨t̂(s)·t̂(0)⟩
# and fit persistence length L_p against the KU-1.1 actin reference of
# 17 μm ± 10 % = [15.3, 18.7] μm.
#
# H.2 brief: `aleph/docs/briefs/H2_single_filament.md` §Implementation
# spec.
#
# Per CLAUDE.md Hard Rules:
# - No magic numbers — every parameter below is either KU-anchored or
#   derived at config-resolve time.
# - Carry-over from H.1: same D3 BAOAB integrator (frozen 2026-05-20
#   at `75a1035`), same KU-1.1 bending modulus κ_B = ℓ_p k_B T.
# - Per BAOAB freeze §Open #1: H.2 is the home for the 3D-corrected
#   bending equipartition gate (single filament, no cross-links →
#   clean per-bond ⟨½ k_θ (θ−π)²⟩ measurement).
# - Per BAOAB freeze §Open #2: H.2 is also the home for the L-M ↔
#   E-M O(Δt²) ↔ O(Δt) order separation test (re-run identical
#   filament under reference E-M via `allow_reference_integrator`).

ecm: null   # (H.2 has no ECM-specific block; placeholder for resolver compat)

filament:

  # ---- Primary biological scales (KU-1.x literature anchors) ----
  L_fiber: 10.0e-6             # m   contour length per filament, KU-1.22
  bead_radius: 30.0e-9         # m   actin bundle cross-section (H.2 brief)
  persistence_length: 17.0e-6  # m   ℓ_p, KU-1.1 actin reference
  bending_modulus: 7.0e-26     # N·m²  κ_B = ℓ_p k_B T at 310 K, KU-1.1
  # μ_actin_bundle = 1.5e-9 N (AFINES canonical, Freedman et al 2017
  # Soft Matter; appropriate for R=30 nm actin bundle).
  # NB: H.2 brief says "k from KU-1.2 spring stretching modulus", but
  # KU-1.2 is defined for collagen FIBRILS (r = 50 nm), not actin
  # bundles (r ≈ 30 nm); the brief's literal reference is
  # internally inconsistent.  L_p validation is insensitive to μ
  # (only κ_B sets L_p), so the choice of μ only affects BAOAB
  # stretching-CFL.  We adopt the AFINES literature value as the
  # most fine-grained per `feedback_acs_no_abstractions`.
  stretching_modulus: 1.5e-9   # N    μ_actin_bundle (AFINES, Freedman 2017)

  temperature: 310.0           # K   37 °C
  kT: 4.28e-21                 # J   k_B · T
  water_viscosity: 6.913e-4    # Pa·s  η_water at 310 K (NIST), KU-1.26

  seed: 42

  # ---- D4: Discretisation (same N=21 as H.1) ----
  beads_per_fiber: 21
  # rest_length filled by resolve() = L_fiber / (beads_per_fiber − 1)

  # ---- Box geometry (open 3D — single filament with periodic box) ----
  # Thermal excursion scale of a 10 μm filament at L_p=17 μm is
  # σ_z ~ √(L²/(3·L_p)) ≈ 1.4 μm.  The original brief's Lz=0.2 μm
  # ("slab thickness for 2D-projection convention") COMPRESSED the
  # natural z-fluctuation by 14×, channelling thermal energy into excess
  # in-plane bending and producing the +50 % equipartition deviation
  # documented in the H.2 v2 closeout.
  #
  # Strict-PASS follow-up (PI 2026-05-25): expanding Lz=0.2 μm → 10 μm
  # restores 3D Boltzmann statistics across all gates (slab ensemble
  # n=5 seeds: L_p_C1=16.56±0.54 μm, ⟨E⟩=0.983±0.033 kT, both inside
  # first-principles 5σ / ±5 % bands).  Lz=10 μm is now the permanent
  # canonical geometry — slab convention is REJECTED for 3D Boltzmann
  # validation.  See `outputs/h2/strict_followup/` for evidence.
  box:
    Lx: 50.0e-6
    Ly: 50.0e-6
    Lz: 10.0e-6                # 3D periodic, σ_z ≈ 1.4 μm fits in ±5 μm

  # ---- D3: Time integration (same L-M BAOAB as H.1, but ANGLE-time-
  #      scale CFL since there are no xl/LJ — see resolve_derived). ----
  dynamics:
    integrator: leimkuhler_matthews_baoab    # D3 Phase 1 canonical
    cfl_safety_factor: 0.1                   # dt = α · τ_min_angle
    # For single filament with no xl: τ_min effectively = τ_angle since
    # stretching ⟨Δℓ⟩ ≪ ℓ_0 at thermal scale (bond extension σ ~ 0.5 nm
    # vs ℓ_0 = 500 nm) — i.e. the stiff bond mode is frozen out of the
    # measurement and doesn't constrain dt. AFINES uses dt = 2e-5 s
    # which is α · τ_angle ≈ 0.005 · τ_angle; we use α = 0.1 for tighter
    # safety. resolve_derived() computes dt_cfl from τ_angle.
    dt: null                                 # filled by resolve()
    # H.2 dt is bound by τ_stretch (stiff stretching mode), not τ_bend
    # (the measurement timescale).  With μ = 1.5 nN (AFINES) and γ_b
    # for R=30 nm, τ_stretch ≈ 130 ns → dt_cfl ≈ 13 ns.  The brief's
    # 2e-5 s dt assumes a semi-implicit integrator that L-M BAOAB
    # explicitly is not, so we cannot match the brief's step counts
    # directly.  Step counts below target ≥100 independent τ_bend
    # decorrelation samples (statistical equivalent of brief's
    # 3000-frame brief sample) for the L_p fit.
    n_steps_equilibrate: 100000              # ~1.3 ms simulated at dt = 13 ns
    n_steps_sample: 50000000                 # ~650 ms simulated (~900 τ_bend)
    sample_interval: 50000                   # 1000 frames, ≈1·τ_bend apart

  # ---- D7 EV: NOT used in H.2 (single filament has no self-interaction
  #             on its own bonded chain; brief explicitly omits LJ) ----
  excluded_volume:
    enabled: false

  # ---- Sanity-Gate / Validation acceptance bands (H.2 brief Table) ----
  acceptance:
    # Brief literal band (KU-1.1 17 μm ± 10 %), retained for diagnostic
    # comparison only — first-principles derivation below is the strict
    # gate.  Brief's 17 μm continuum L_p numerically equals
    # κ_B/(k_B T) = 16.355 μm; the discrete-3D correction at α=16.4 adds
    # +0.5 % giving L_p_C1_predicted = 16.44 μm (see derivation §below).
    L_p_band_m: [15.3e-6, 18.7e-6]

    # **FIRST-PRINCIPLES derived bands** (PI 2026-05-25 strict-PASS
    # follow-up).  Replaces the measurement-anchored bands of PI
    # 2026-05-21 honest-audit response.
    #
    # Theory: for a freely-jointed semiflexible chain in 3D with per-
    # bond Hamiltonian H = ½ k_θ (θ-π)², the EXACT discrete tangent-
    # tangent correlator is
    #     C(s) = ⟨t̂_i · t̂_{i+s}⟩ = a^s,   a = ⟨cos φ⟩_3d
    # with φ = π − θ ∈ [0, π].  Numerical integration of the 3D
    # Boltzmann distribution at α = k_θ/(2 kT) = 16.355 gives
    # a_3d = 0.970043 → L_p_predicted = −ℓ_0/log(a_3d) = 16.439 μm.
    # Continuum κ_B/kT = 16.355 μm (finite-α discreteness +0.5 %).
    #
    # Sampling uncertainty (n_indep ≈ 19 interior bonds × 900 τ_bend
    # decorrelations = 17 100 samples):
    #     Var(cos φ)_3d = 0.000879 → σ(C(1)) = 0.000227
    #     σ(L_p_C1) = L_p × σ(C(1)) / (a_3d · |log a_3d|) = 0.126 μm.
    # 5σ band on L_p_C1 = [15.81, 17.07] μm.
    #
    # Empirical chain-mode scatter (n=5-seed slab Lz=10 μm ensemble,
    # outputs/h2/strict_followup/slab_Lz10um_aggregate.json):
    #     L_p_C1 = 16.56 ± 0.54 μm   — mean inside 5σ band, individual
    #         seeds have ±3.3 % scatter from undersampled long-wavelength
    #         chain modes (τ_chain ≈ 5.6 s ≫ 0.65 s simulated time).
    # The single-seed pytest gate is widened to 3σ_empirical from the
    # first-principles mean = 16.44 ± 1.6 μm to cover this physical
    # seed-to-seed scatter; ensemble mean must hit the 5σ analytical
    # band.
    L_p_band_m_C1:        [14.8e-6, 18.0e-6]    # 3σ_empirical, single-seed gate
    L_p_band_m_C1_5sigma: [15.81e-6, 17.07e-6]  # 5σ analytical, ensemble gate
    # L_p_tail (fit s∈[1,10]) has additional scatter from chain-mode
    # coupling: slab ensemble gives 18.45 ± 6.85 μm — high scatter from
    # finite N=21 chain.  Single-seed band ±50 % of L_p_C1 prediction.
    L_p_band_m_tail:      [8.0e-6, 33.0e-6]     # ±50 % chain-mode scatter

    # Angle distribution test against first-principles 3D Boltzmann at
    # theoretical α=16.4 (NOT effective-k_θ rescaling — that was the
    # measurement-anchored shortcut of 2026-05-21).
    #
    # Two derivation-based metrics with well-defined critical values:
    #   χ²/df: Pearson statistic with 50 bins, df=49.
    #          critical 95 % = 66.34 → χ²/df ≤ 1.354 PASS.
    #   D_KL:  Kullback-Leibler divergence (nats), threshold via
    #          2N·D_KL ~ χ²(df) asymptotic relation.
    #          KL_thresh_95 = chi2_crit_95 / (2 · n_indep)
    #                       = 66.34 / (2 · 17100) ≈ 1.94e-3 nats.
    # Slab ensemble pooled (n=5 seeds × 1000 frames × 19 bonds = 95 000):
    #     χ²/df ≈ 1.0 (by construction matches 3D Boltzmann).
    angle_chi2_per_df_max: 1.354       # Pearson critical 95 %, df=49
    angle_KL_nats_max:     1.94e-3     # KL threshold 95 %, 17 100 samples
    angle_ks_stat_max:     0.10        # retained as diagnostic
    angle_ks_p_min:        0.0         # informational only

    # Per-bond equipartition.  Strict target: numerical 3D exact at
    # α=16.4 = 0.9898 kT (Rayleigh limit ≈ 1.0 kT; finite-α correction
    # via sin φ series −1 %).  Slab ensemble n=5 seeds gives
    # ⟨E⟩ = 0.983 ± 0.033 kT, rel = −1.7 % ± 3.3 % — all 5 inside
    # ±5 % strict tolerance.  Brief 2D target ½ kT REJECTED (was the
    # quasi-2D slab confinement artefact).
    equipartition_target_3d_kT: 0.9898    # numerical 3D exact at α=16.4
    equipartition_rel_tol_3d:   0.05       # ±5 % around the 3D target

    # Brief literal target retained for diagnostic only.
    equipartition_rel_tol: 0.05

  # ---- L-M vs E-M order verification (BAOAB freeze §Open #2) ----
  # When `allow_reference_integrator: true`, the test harness re-runs
  # the identical filament under HOOMD-native md.methods.Brownian
  # (Euler-Maruyama) at halved Δt and confirms L_p agrees within 1 σ.
  # This is the order-of-accuracy separation gate that closes
  # BAOAB §Open #2.
  reference_integrator:
    allow: true
    name: hoomd_brownian
    dt_factor: 0.5

  # Demo mode opt-out — relax bands for a fast smoke run.
  demo_mode: false

  # ---- Derived parameters (filled by resolve()) ----
  derived:
    rest_length: null              # = L_fiber / (beads_per_fiber − 1)
    bond_k: null                   # = μ / ℓ₀                      [N/m]
    angle_k: null                  # = κ_B / ℓ₀                    [N·m]
    angle_t0: 3.141592653589793    # π — HOOMD straight-chain convention
    gamma_b: null                  # = 6π η R                      [N·s/m]
    tau_stretch: null              # = γ_b ℓ₀ / μ                  [s]
    tau_bend: null                 # = γ_b ℓ₀³ / κ_B               [s] (= γ_b ℓ₀² / k_θ; position-space angle relaxation)
    tau_min: null                  # min(stretch, bend)
    dt_cfl: null                   # = cfl_safety · τ_min          [s]
