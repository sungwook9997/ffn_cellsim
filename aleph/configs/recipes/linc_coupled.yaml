# ============================================================================
# RECIPE: linc_coupled  (H.7 platform — H.LINC nesprin-SUN bridges LIVE, 2026-06-09)
# ============================================================================
# The suspended/rounded MCF7 cell with the LINC complex turned ON: explicit
# nesprin-SUN harmonic bridges mechanically coupling the nucleus to the
# perinuclear INTERMEDIATE-FILAMENT cage (Option A — the LIVE IF cage is the
# real perinuclear load path). Each bridge is a per-bond EXACT-r0 harmonic
# (force-free at its as-built nucleus↔if_bead separation); the ~8 pN resting
# tension is generated by actomyosin AFTER equilibration, not injected at build.
# linc_ bonds are γ-denylisted (registry-driven), so LINC does NOT contaminate
# the cortical-tension estimator.
#
# Extends if_cage: LINC (Option A) REQUIRES intermediate_filaments (its
# acceptors are if_bead) AND nucleus (baseline-required, always on). Both are
# enabled by if_cage / the baseline.
# ============================================================================

name: linc_coupled
description: Suspended MCF7 cell with the nucleus LINC-coupled to the perinuclear IF cage.
scope: suspended
extends: if_cage

observables: [cortical_tension, linc_resting_tension, nucleus_cytoskeleton_coupling]

enable:
  - linc                    # H.LINC nucleus_bead → if_bead bridges (per-bond EXACT-r0)

disable: []
declare_pending: []

notes: >
  Option A (REMAINING_DECISIONS 2026-06-09): bonds each nucleus_bead to its
  nearest perinuclear if_bead within ONE IF segment length (capture_radius =
  IF l_seg, geometry-derived), capped at the IF filament count (one LINC per
  perinuclear IF filament). k_linc=1e-2 N/m is the ROUTE-A folded-rod secant
  (Rief 1999; ORDER, conf MEDIUM, PI-pending). The PRIMARY no-contamination
  control (cortical γ_soft unchanged ON vs OFF, linc_ denylisted) + n_bridges>0
  (no zero-bonds trap) is the LIVE build-time gate; the [2,10] pN <T_linc>
  resting-tension oracle needs an equilibrated actomyosin run and is deferred
  (full-cell raw run trips the BAOAB guard — needs the equilibration prelude).
  ⚠ At the ×40 mesoscale the nucleus↔if_bead separation is ~0.5-1.5 µm (NOT the
  50 nm real nesprin span), so r0 is an effective mesoscale coupling length and
  the 8 pN oracle is approximate — see PLATFORM_PI_QUEUE.
