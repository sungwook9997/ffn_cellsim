# + AC_PARALLEL_SESSIONS_2026-07-16.md §4 Session F.
# Format mirrors ac/fluid/params_i0b1.yaml + ac/motor/params_i0b3.yaml:
#   claim ID · evidence status · owner · provisional policy · blocking gate.
#
# GOVERNING RULE (§1.6 + §4C, HARD): any value whose literature grounding is NOT closed is
#   value: null  +  evidence_status: "GAP — PI"  and is surfaced to PI. Provisional PI-authored
# values carry owner + expiry_trigger and are NEVER tuned to pass a gate or to hit a
# protrusion / bundle / traction band (§6.2 report-not-tune).
#
# ANALYTIC-BUILD UNBLOCKED: every I4 analytic gate is MAGNITUDE-INDEPENDENT and sweeps these as
# oracle variables — Gate-1 cortex parity is bit-identical regardless; the branch-angle gate uses
# the equipartition relation sigma_theta=sqrt(kT/k_theta) (only the SD, sourced 9 deg, is needed);
# the crosslink-KMC gate checks the k_on/k_off bound fraction shape; the flux-limit gate checks
# monotonicity. The NATIVE protrusion/retrograde-flow + bundle-condensation magnitude gates (lead,
# gbook) are INVALID until the GAP rows close.
# ============================================================================

meta:
  increment: I4
  gate: I0-B4
  track: unified-weave
  owner_session: "Session F (unified-weave)"
  decided_by: PI                                 # every GAP below awaits PI source-audit
  drafted_on: "2026-07-16"
  native_run_blocked_on: [k_arp0, k_m, k_cap, npf_areal_density,
                          fascin_bundle_stiffness, fascin_spacing_um, fascin_bundling_angle_deg,
                          filaments_per_bundle, tip_nucleator_density]
  analytic_build_unblocked: true                 # parity + shape/invariant gates need no physiological magnitude
  units_convention: "SI in note text; engine runtime is um-pN-s (convert at load)"
  primitive: >
    ONE unified actomyosin network (weave_cell/WovenCell): cortex delegates to ff.weave (isotropic seed,
    demoted from authoritative-bundle); ventral/dorsal SF + transverse arc + perinuclear cap + filopodium are
    isotropic-conditional seeds on their manifolds (bundles CONDENSE at I5, not scripted here); lamellipodium
    is a REBUILT dendritic Arp2/3 net (mother/daughter tree, angle-harmonic 3-body branch, N-fixed dormant-
    daughter activation, flux-limited by the I1c monomer field). ONE crosslinker-relaxation channel
    (topology-reforming KMC) — the ff xl_turnover r0-creep channel is DISABLED (double-count guard).

# ============================================================================
# GROUNDED — the branch-angle knobs (Faessler 2020). theta0 + sigma_theta are sourced; k_theta is
# DERIVED from sigma_theta by equipartition (NOT tuned): k_theta = kT / sigma_theta^2.
# ============================================================================
parameters:

  theta0_branch:
    title: "Arp2/3 rest branch angle"
    symbol: "theta0"
    value: 1.2217304764                          # 70.0 deg
    unit: "rad"
    evidence_status: "verified/High"
    source: "Faessler 2020 EMBO J 39:e104254 (in-cell cryo-ET branch junction 68 +- 9 deg); Mueller 2017"
    kb_note: "mirrors ff.architecture_spec.ARP23_BRANCH_ANGLE_RAD; the angle FLUCTUATES (not a rigid 72 deg)"
    policy: "rest angle of the 3-body angle-harmonic branch bond; NOT a rigid constraint."

  sigma_theta_branch:
    title: "Arp2/3 branch-angle thermal spread (SD)"
    symbol: "sigma_theta"
    value: 9.0
    unit: "deg"
    evidence_status: "verified/High (PI-gated SD)"
    source: "Faessler 2020 (68 +- 9 deg in-cell)"
    policy: "SETS k_theta by equipartition k_theta = kT/sigma_theta^2 (=0.173 pN*um/rad^2 at 310 K). Do NOT clamp."

  k_theta_branch:
    title: "Arp2/3 branch angle-harmonic stiffness (DERIVED)"
    symbol: "k_theta"
    value: 0.173
    unit: "pN*um/rad^2"
    evidence_status: "derived (equipartition from sigma_theta)"
    derivation: "k_theta = kT/sigma_theta^2 = (4.28e-3 pN*um)/(9 deg in rad)^2 = 0.173; mirrors ARP23_BRANCH_K"
    policy: "DERIVED, never independently tuned. Thermal sigma is an OUTPUT (sqrt(kT/k_theta)), not clamped."

