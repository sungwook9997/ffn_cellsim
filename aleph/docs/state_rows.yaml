- headline: '**The production explicit inner step is stable at full native, and `kmax` was never a bound** — the ratio to it IS the per-node bond
    accumulation, measured. **Not** `λ_min`, the condition number, or any eigenvalue as a material property.'
  claim: '**The production explicit inner step is stable at full native, and the constant it is sized by was never a bound.** `λ_max(P K P \|range(P))
    = 8.331e6 pN/µm` — measured on the operator the inner iteration `pos += dt_mu·P F` actually linearises to, restricted to the constraint tangent
    space — resolved to a Parlett bound of 6.9e-18, with two independent random starts agreeing to 2.2e-16. That is **2.9459× the build''s own
    `kmax`**, so the largest SINGLE stiffness bounds nothing: a node accumulates one contribution per incident bond and this ratio IS that accumulation,
    measured. Hence `dt_mu·λ_max = 0.2946 < 2` — **stable, with 6.79× headroom**, i.e. the `0.1` in `dt_mu = 0.1/kmax` does exactly the work of
    covering it. FIRE''s 10× multiplier puts the product at 2.9459, the SAME number by identity and not a second fact; reported and **NOT adjudicated**,
    since FIRE is damped MD with a differently-scaled bound. Same run, **population-independent** by per-contribution algebra: the cortex tangent
    is exactly multilinear (`‖K − Σ_j K_j‖/‖K‖ = 1.0160e-16`, each family assembled ALONE, never differenced) with all five exercised families
    symmetric against their own derived floors — which **removes the "cortex-only paths untested" caveat** on the multilinearity row above. Lanczos
    agrees with the dense eigensolve to 5.29e-16 on the same Warp operator. **NOT** quotable: `λ_min`, the condition number or its decades — the
    folded small end did NOT resolve (bound 25× the value), so (c) 14''s condition number is now re-measurABLE but still not re-measurED; and
    no eigenvalue as a cortical material property (`k_xb`/`k_backbone`/`k_linc` are PI-GAPs). `steric_wca` and `myosin` are recorded UNCERTIFIED
    with their reasons, not assumed.'
  population: 551,434 nodes / 1,654,302 DOF; 70,686 fibers / 1,413,720 crosslinks / 8,840 heads — **FULL NATIVE**; A5000 `cuda:0`
  build: '`a44a1de3` (self-stamped, `source: declared`; the driver''s whole first-party import closure was verified 79/79 against the run host
    before launch)'
  artifact: '`observe/native_cortex_spectrum/record.json` + `REPORT.md` + 3 figs'
- headline: '**The cortex owns its device arrays, and they are the incumbent''s cortex** — node-by-node force parity with a control that demonstrably
    fails. **Not** rung `CONNECTED`, and not a physics magnitude.'
  claim: '**The cortex owns its device arrays, and they are the incumbent''s cortex.** Measured at full native: the engine cortex allocates position/force
    of length **exactly 494,802** at device pointers distinct from `cell.pos_d`/`cell.f_d`, launches the incumbent''s own `cytosim_bending` +
    `link_spring` kernels over them, and the two force fields agree node-by-node — max delta **9.97e-18 pN** against a 0.0356 pN reference field
    (**2.80e-16** relative, vs T2''s pre-declared 1e-12 criterion). The comparison is demonstrably able to fail: injecting a known 0.3564 pN recovers
    it exactly and fails parity. A rejected step restores every node exactly and an accepted step keeps the candidate. This ends the bind-target
    port, so the **nine** connectors terminating on the cortex have a cortex-owned force array to close an adjoint pair against for the first
    time. Quote the mechanism + the parity ratio + the control. **Not** rung `CONNECTED` — no connector was dispatched inside an accepted-step
    transaction; and **not** a physics magnitude, since these are the incumbent''s own forces. Note what the parity arm does NOT discriminate:
    with the compartments off `n_total == n_actin`, so the length limb is only discriminating against the composed build, where it is (myosin
    arm: n_total 509,830 while the engine array stays 494,802).'
  population: 70,686 filaments / 494,802 actin nodes / 1,413,720 crosslinks / 353,430 bending triples; A5000 `cuda:0`
  build: '`576ebf42` (`source: declared` — gbook is not a git checkout, so the commit is the caller''s assertion)'
  artifact: '`cortex_ownership/native_record.json` (`run-record@2`, verdict PASS, rung CUDA_UNIT / QuantitativeClaim BLOCKED, `timing` 29.7 s
    `comparable: true`)'
- headline: '**Negative result, do not re-queue: 66× the inner budget ends HIGHER than the start** (60 iterations −0.52%, 4,000 **+0.14%**). With
    the same day''s uniformity result, construction and budget are both excluded. Quote the **exclusion** — not a rate, not an operator property,
    **not a curve**.'
  claim: '**Negative result, do not re-queue: the resting residual does not descend, and the iteration budget is not why.** One `--from-resting`
    outer step at full native, inner budget raised 60 → 4,000: the candidate goes 47.405172429438764 → **47.471519** pN (+0.14%), against 47.405172
    → 47.157182 (−0.52%) at 60. The step is rejected and rolled back both times, so `residual_end` returns to start. **66× the budget ends higher
    than it began**, which is neither of the two readings that were posed before the run — not a stall, not a slow descent. Taken with the same
    day''s uniformity measurement on the same configuration (per-node |F| p50 0.02373, p99 0.02436, max 0.03564, max/p50 = 1.50; median flat across
    five radial shells 0.02416 → 0.02363; top 0.4% of nodes carrying 0.80% of |F|²; `f_steric` zero everywhere, zero interpenetration), **construction
    is excluded and budget is excluded**, and the operator/preconditioner is what remains. **This is the third independent result pointing there**
    — `STATE.md` (b) already carries the fiber-quotient coarse operator failing to close the same static residual. ⚠ **NOT A CURVE.** `capture_convergence_history`
    populates only on the accelerated-solver branch and this ran `explicit`, so `curve_samples: 0`: these are two ENDPOINTS, not a shape. Anyone
    re-running for the shape needs the accelerated path. ⚠ The record **declares no threshold, deliberately** — it self-stamps `kind: diagnostic`
    and scores nothing, because declaring a threshold after seeing the number is what the charter forbids. What it licenses is the choice of next
    work, and that choice is the PI''s. ⚠ The artifact''s own `import_closure_note` says the build is "established by CONTENT, not by the caller''s
    assertion"; that overreaches — the closure check establishes the host matched the local working tree, not that either matches `4c165576`.
    The authoring session withdrew the phrasing in prose; the record still carries it. **Not** quotable: a convergence rate, any operator property,
    or the wall time as an engine speed — `timing` stamps itself `comparable: false` because the gate verdict is absent, so the cost belongs to
    a step that established no convergence.'
  population: 70,686 filaments / 494,802 actin / 511,114 total nodes; 4,000 inner iterations; RTX 4090-1 `cuda:0`
  build: '`4c165576` (`source: declared`) — **the only row whose closure was content-checked**: 69 files hash-compared against the run host pre-launch,
    0 mismatched.'
  artifact: '`resting_residual_curve/residual_curve.json` (`kind: diagnostic`, `timing.comparable: false`) @ `2e2a2c9d`'
- headline: '**Membrane, cortex and nucleus address DISJOINT blocks at full native**, control refuses the arrangement they replaced. **Slice views,
    NOT private allocations.** **Not** `CONNECTED`, no magnitude.'
  claim: '**The three interior-column surface components address disjoint blocks, and the check that says so can fail.** At full native the driver
    derives the blocks from the built cell — cortex `[0, 494802)`, nucleus `[494802, 495444)`, membrane `[495444, 536406)` — and `assert_component_state_disjoint`
    certifies them on the device BYTE SPANS read off the arrays, not on a declaration: cortex position ends at address 146046871984, which is
    exactly where nucleus position begins. The positive control rebuilds the pre-Card-5 arrangement (membrane and cortex both handed the whole
    `cell.pos_d`/`cell.f_d`) and the same call refuses it, with its refusal message stored in the artifact. Two defects were closed to make the
    check mean anything: the guard compared `storage_key` (device pointer) for EXACT equality, so two OVERLAPPING slice views — different pointers,
    same nodes — passed it, and `PressureCoupling.accumulate` launches `dim=node_pos.shape[0]` while indexing `node_volume[i]`, so the global
    position array it was handed ran that launch 495k elements past the end of the weights (latent: this driver never calls the slice''s own force
    pass). ⚠ **These are SLICE VIEWS of the one array the incumbent''s inner solve relaxes, and the record self-stamps `arrays_private: false`
    / `ownership_class: disjoint_slice_views`.** A private allocation here would be a set of arrays the solve never reads and never writes — distinct
