rows:
- headline: '**PHASE 4 runs at native — its gate is EXACT (0.000% over 5 runs) about a residual that swings 1037%**, and 626x looser than faces-only. **0 accepted.**'
  claim: 'Two results from one run, both FULL NATIVE on a 4090. (1) **The step machinery runs**: ten steps at 0.1475 s/step static and 0.2694 s/step with relaxation over 4,361,496 nodes, assert_partitioned re-asserted every step, and a sign gate passing BEFORE any step (mean radial force -1.1504e-03 pN under a positive surface tension — a closed surface pulled inward) whose two arms agree to 15 digits. **Zero steps accepted and zero rejected**: every one records ACCEPTANCE_UNDEFINED, and accepted_step_evidence is None. (2) **The balance gate cannot see divergence.** Frozen geometry holds the residual at ~2e-13 pN — not a small force but float64 SUMMATION ERROR on an internally closed system, where every force appears with both signs so |sum F| is zero by construction. With relaxation on it climbs 1.8e-13 -> 7.1e-9 pN, four orders, and the tolerance is 2.683e-06 throughout: **all twenty steps are inside it**, the static arm by seven orders and the moving arm by 380x. NOT a bug in ledger.py, which does what its docstring says (adjoint closure); the defect is that a convergence gate rested on it. Also measured: the static residual is NOT bit-identical across steps while nothing moves (atomic-add ordering), so **any residual-DIFFERENCE criterion must clear a ~1e-13 pN floor**. (3) **The gate is exact about the wrong thing.** FIVE runs per configuration on ONE cell (an earlier single-run table compared two different builds and is superseded): binding all seven strand populations gives 8,489,866 force terms and a tolerance of 1.75492e-03 pN against faces-only 2.80399e-06, **626x**, with a spread across the five runs of **exactly 0.000%** - while the residual it bounds spreads **149% / 1037% / 18%** in the three configurations. The tolerance is a deterministic function of the configuration; the imbalance it is meant to bound is stochastic and never consulted. Wall clock: faces-only .1423-.1547 vs all-seven .1595-.1813 s/step, DISJOINT (median +10.6%), but the intermediate steps OVERLAP so no per-population attribution is quotable. NO magnitude anywhere here: the coefficients are declared test points, so the residual is not a physical residual and neither the growth nor the tolerance is a physics result.'
  population: 4,361,496 nodes; 4090 — FULL NATIVE
  build: '2026-08-21 `world/`'
  artifact: '`world_phase4/*.json` + `BALANCE_GATE_MEASURED_2026-08-21.md`'
- headline: '**The engine is BITWISE DETERMINISTIC for a fixed seed** — same closure digest, same gamma.'
  claim: 'Two 12-step runs of the identical FULL-NATIVE configuration and seed, compared per step on the gamma trace: **worst relative difference exactly 0.000000e+00** - np.array_equal True, and BOTH RUNS CARRY THE SAME closure_digest, argv and warp version. ⚠ The first version of this row said 2.168718e-16, from a pair whose stamps later showed DIFFERENT closure digests under one hand-written commit stamp: the code had changed between them and the row claimed they were identical. run_provenance caught its own author''s claim; re-measured on a verified-identical closure the answer is stronger, not weaker. NOT implied by the earlier result that the static residual is not bit-identical: that is |sum F|, a CANCELLING sum where atomic-add order shows at the 1e-13 floor; gamma does not cancel that way. Measured because a device/host gamma A/B disagreed by 15%, and its two candidate causes - a wrong estimator or a nondeterministic engine - are otherwise indistinguishable. It was the estimator: the paths were handed DIFFERENT CUT CENTRES (origin vs actin centroid, 2.05e-02 um apart), and a centre offset does not perturb the sum, it flips which elements CROSS a plane. Same explicit centre on both, neither defaulting: **3.419992e-16** at **27.2x** (8.0000 -> 0.2943 s/step). ⚠ THE CONSEQUENCE IS NOT THE SPEEDUP - it is that SEEDS DEFINE REPLICATES. (e) 1 D-2 asks for the scatter of CONFIGURATIONS and calls within-run variance the likeliest way to write the amendment and measure nothing; at 1e-1 nondeterminism, observe_gamma_seed_scatter would have measured execution noise. NO magnitude: no gamma value is quotable, (c) 3 and (c) 17 stand, coefficients are test points, mobility UNSOURCED.'
  population: 4,558,554 nodes; 4090 — NATIVE
  build: '`ccbda122`'
  artifact: '`world_phase4/det_[ab].json`'
- headline: '**Every node lies inside the built membrane**, enforced on built positions. Geometry; no force evaluated.'
  claim: '**Eleven populations stand at native with n_outside = 0 against the built membrane radius**, checked by assert_inside_membrane on the positions the builders actually produced. This closed a defect the RENDER found and the numbers confirmed: the previous placement put **95.5% of the stress fibres and 92.7% of the lamellipodium OUTSIDE the cell** while assert_partitioned reported success - partition is a property of ID ranges and says nothing about where a node is. The counts had gone through BondCount and were labelled PI_GAP; the GEOMETRY went through nothing and was unlabelled constants at two duplicated call sites. n_stress_fibres is now DERIVED from the basal contact disc and **inherits the pitch source class**, so the derivation does not launder its input.'
  population: 4,588,662 nodes / 11 populations + 63³ field; 4090
  build: '2026-08-21 `world/`'
  artifact: '`world_phase1/phase1_inside.json`'
- headline: '**The `nmii_sf_motor` force field is non-conservative**, and the crossbridge is why. Quote the attribution and the scaling exponents;
    **no magnitude**.'
  claim: '**The `nmii_sf_motor` force field is non-conservative, and the crossbridge is why.** Loop work `∮F·dx` scales as `a²` and is exactly
    segment-independent with heads bound (circulation), and as `a³`/`N⁻²` both at t0 and — the control, same configuration, heads detached — as
    quadrature, dropping 8,170×. **Population-independent**: whether a force law is a gradient is a property of its differential form, and ONE
    bound head settles it. So an energy ledger for this lane MUST carry an active-work term, and the symmetric tangent is a quasi-Newton operator
    that cannot represent what it differentiates. Quote the attribution + the scaling exponents; **no magnitude**.'
  population: 904 nodes / 2,712 DOF; 320 heads / 16 minifilaments; A5000
  build: '`db841185` (self-stamped)'
  artifact: '`observe/sf_operator_observables.json` + `.npz` + `REPORT.md` + 4 figs'
- headline: The assembled tangent is **exactly multilinear** in its stiffness families and **symmetric to round-off**, which licenses the analytic
    Hellmann-Feynman gradient.
  claim: 'The assembled tangent is **exactly multilinear** in its stiffness families (`‖K − Σ_j K_j‖/‖K‖ = 9.35e-17`) and **symmetric to round-off**
    (max asymmetry 1.02e-10 / 5.82e-11 vs a derived floor of 3.0e-7). Both are per-contribution algebraic properties, so they survive population
    change — but **only for the families this slice launches**: the cortex-only paths (multigrid, fiber-block, ERM, membrane) are untested. Licenses
    the analytic Hellmann-Feynman gradient, which FD confirms (median 2.0e-9, 88.3% within 1e-6).'
  population: same run
  build: '`db841185`'
  artifact: same artifact (`multilinearity`, `symmetry`)
- headline: '**A built bipolar minifilament has 19 INTERNAL zero-stiffness directions**, 95.6% of that subspace on the heads. A single-object
    property, so it transfers.'
  claim: '**A built bipolar minifilament has 19 INTERNAL zero-stiffness directions** beyond its 6 rigid-body modes, with **95.6% of that subspace
    on the heads**. Population-INDEPENDENT by construction, not by assertion: the 102-DOF block was verified **exactly** decoupled (max off-block
    0.0 pN/µm) before the count was taken, all 16 blocks agree, and the count is cross-checked two ways (eigenvalues under the derived floor;
    projection onto the six explicitly built rigid-body motions). This is the retracted floppy FRACTION restated in the form that transfers —
    see (c) 14. **Not** quotable: the per-mode participation figure in the same record, because the null space is degenerate and that number describes
    the eigensolver''s basis, not the object.'
  population: 102 DOF / 34 particles (14 backbone + 20 heads) per block, 16 blocks; A5000
  build: '`49d2215a` (self-stamped)'
  artifact: '`observe/sf_operator_observables.json` (`minifilament_internal_floppiness`) + `REPORT.md` §1b'
- headline: '**The `nmii_sf_motor` lane accepts on a DEVICE PREDICATE, and that predicate can say no** — a positive control injects one head''s
    stall force one-sidedly and the same path rejects it. **The predicate tests ADJOINT CLOSURE, not convergence** (`sf_motor_slice.py`''s own
    docstring says so), so a non-converged step is not what it rejects. **Not** the tension, **not** rung `CONNECTED`.'
  claim: '**The `nmii_sf_motor` lane accepts on physics, and the gate can say no.** The predicate is the device force-balance flag, not `accepted_d
    = ones`: each body reduces its own force array into one half of it, the tolerance is derived on-device from the ledger''s own Σ\|f\| (D8),
    and 20/20 steps were admitted with the Newton residual 3–4 decades under that floor. The **positive control** injects one head''s stall force
    one-sidedly and the same path rejects it, reproducing the injection to 14 digits and bit-restoring the step. Its **energy ledger closes with
    no energy function**, and halving the mobility halves the residual (**exponent 1.0025**) — first-order integrator consistency, not a leak.
    Quote the mechanism + the exponent + the control. **Not** the tension (same run''s D7 verdict is `VOID`, residual 22.9% of signal) and **not**
    rung `CONNECTED`, which needs the native inventory. Re-measured in the same run and superseding the `fd482920` row this replaces: ownership
    is physically split (two never-merged device arrays), tension is exactly 0 while no head is bound (5.55e-14), heads go 0 → 316/320 by events,
    the FA reaction is 100% inward, and a rejected step bit-restores the binding SoA **and both** position arrays.


    **SCOPED 2026-07-28 (night) after a cross-lane adversarial audit, verified against the code:** `balance_ok_d` is the D8 connector adjoint/conservation
    gate — it checks that two independent bodies'' resultants cancel. `ac/engine/sf_motor_slice.py:65` states it verbatim: "The gate tests the
    adjoint wiring, not the convergence". So "accepts on physics" must not be read as "accepts on convergence": this row''s positive control demonstrates
    the gate rejecting a BROKEN ADJOINT, and nothing here shows it rejecting an unconverged solve. The distinction matters beyond this row — the
    PROPOSED gate amendment''s stage-1 inner gate is written as "accept on `balance_ok_d`", which as written would rest the convergence gate on
    a predicate that cannot fail for non-convergence.'
  population: 904 nodes / 2,712 DOF; 320 heads / 16 minifilaments — **0.18% of native**; A5000
  build: '`49d2215a` (self-stamped)'
  artifact: '`gate_b_sf_motor/sf_motor_native_gate.json` + `REPORT.md` §7'
