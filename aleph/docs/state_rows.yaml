- headline: '**The SF motor DOES build tension** once the α-actinin crosslink is out of the operator and the clock passes the induction period
    — first non-`VOID` verdict and first `comparable: true` cost. **Not** the tension as a physical SF magnitude.'
  claim: '**The SF motor DOES build tension — once the α-actinin crosslink is out of the operator and the clock passes the induction period.**
    Two native measurements, one A/B. **(1) The crosslink is what blocks convergence:** at identical 10,400 nodes / 4,000 heads / 200 stations
    / identical budget, 0 α-actinin dorsal↔arc joints gives a free-node residual of **1.33e-12 pN** and 160 joints gives **1.46e-02** — **ten
    decades**, one stiffness family. **(2) On the crosslink-free topology carried to 5.0 s the tension emerges 0 → 5.00 pN** with 3,933/4,000
    heads bound, residual **1.18e-07 pN**, **D7 = PASS** at residual/signal 2.36e-08 — this lane''s FIRST non-`VOID` verdict, all twelve mechanism
    predicates true, and a `comparable: true` timing block: **1.122 s per accepted step at that stated convergence**, 4,008 inner iterations,
    real-time factor 112. Population scaling is exact where it must be: 904 → 9,040 nodes moved `T_max` by **+0.03%** while the FA traction resultant
    scaled **×10.2** (intensive vs extensive). **RETRACTS the row this replaces**, whose reading — the converged equilibrium carries no tension
    — was a DURATION artifact: every run behind it was 20 steps = 0.20 s, and 0.20 s is inside the induction period (converged `T_max` there is
    3.7e-06 pN, at 0.50 s it is 0.947). What survives from it: at 0.20 s the tension a non-converged solve reports IS its residual, so those magnitudes
    meant nothing. **NOT** quotable: 5.00 pN as an SF tension — every constant is a PI-GAP, the trace is still rising ≈0.7 pN/s at 5.0 s (no steady
    state), and this is a deliberately REDUCED architecture (ventral only, no dorsal/arc/cap) at an SF inventory the KB has no axis for.'
  population: 200 ventral sarcomeres / 10,400 nodes / 4,000 heads / 0 crosslinks; A5000 — native SCALE, but a reduced architecture and an inventory
    that is still a PI-GAP
  build: '`2001c119` (the topology A/B + the PASS run) + `576ebf42` (the population scaling); `source: declared` — gbook is not a git checkout'
