      - myosin II
      - myosin-2
      - NM2A
      - NM2B
      - myosin heavy chain
      - actomyosin
    off_topic:
      - kinesin
      - dynein
      - myosin V
      - myosin VI
      - Arabidopsis
      - plant
    component: nmii
    connector: nmii_sf_motor
    connector_family: motor
    parameter_axis: F_stall_head
    pi_gap_card: N1
    absence: wrong_quantity
    note: >
      Card N1: the closest primary (Norstrom 2010) reports STEP SIZE (nm), not isometric stall FORCE
      (pN).  Reject any hit whose number is a length.  Isoform matters: NM2A vs NM2B.
    terms:
      all: ["non-muscle myosin", "stall force"]
      any: ["optical trap", "single molecule", "isometric", "NM2A", "NM2B"]

