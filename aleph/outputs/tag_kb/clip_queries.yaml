# Paper-clip query set — anchored to the ac/engine component/connector vocabulary.
#
# WHY THIS FILE IS NOT A KEYWORD LIST.  Every query names the component or connector it is trying to
# constrain and the parameter axis it is hunting, so each arriving PDF carries its reason for
# arriving.  That provenance is the seed of the paper -> connector edge; recording it at clip time
# costs nothing and retrofitting it later costs a re-read of the whole corpus.
#
# `component` / `connector` / `connector_family` MUST be members of the enums in
# `aleph/ac/engine/contracts.py` (ComponentRole / ConnectorFamily / reference_cell_architecture()).
# A value not in those enums is a label this project cannot act on.
#
# `absence` records what the 2026-07-23 sourcing pass MEASURED about this axis, parsed out of
# docs/v2_audit/PI_GAP_EVIDENCE_CARDS_2026-07-25.md.  The four kinds need different queries:
#   none           — no value found in the literature at all (13 cards).  Widen: search the assay,
#                    not the parameter name.
#   proxy          — exists for another cell type only (2 cards).  Search the target line explicitly.
#   paywalled      — exists but inaccessible (2 cards).  Look for a preprint or an SI-bearing copy.
#   wrong_quantity — a number exists and is the WRONG PHYSICAL QUANTITY (2 cards).  The most
#                    dangerous class: relevance ranking returns it confidently.  Name the quantity's
#                    DIMENSION in the terms so the reviewer can reject on sight.
#
# Sources: PI_GAP_EVIDENCE_CARDS_2026-07-25.md (parameter axes, absence verdicts);
#          CLAUDE.md §Active roadmap (the six stage-0 observables, K=2 x M=2 cell states).

schema: ffn-ac-clip-queries-v1

# ---------------------------------------------------------------------------------------------
# RELEVANCE TRIAGE (PI 2026-07-28, after the year-only dry run).  Year is the only HARD filter and
# fwci is reading order; subject-matter fitness is judged HERE, because a citation metric ranks
# papers without knowing what they are about.  Measured failures that forced this:
#   `WAVE complex density`        -> many-body-localization + ferromagnetic-soliton physics, and a
#                                    run of EEG / epileptology / ECG papers (the word "wave")
#   `filopodium tip complex`      -> Bordetella / Shigella type-III and type-VI secretion systems
#   `microtubule number cell`     -> mitotic spindle, kinetochore, plant, and neuronal-axon work
# An FWCI floor removes none of these: they are well cited, just not about our object.
#
#   anchors    — ANY match in title+abstract CONFIRMS the subject -> `candidate` (auto-fetched)
#   off_topic  — ANY match DISQUALIFIES -> `off_topic`.  Checked BEFORE anchors, because a paper can
#                be genuinely about microtubules and still be about the mitotic spindle.
#   neither    — `needs_review`: PRESERVED for a human, never auto-fetched, never auto-dropped.
#
# ORGANISMS ARE PER-QUERY, NOT GLOBAL, and the reason is a near-miss: Arp2/3 and capping-protein
# kinetics are measured in vitro on yeast and Acanthamoeba proteins, so a global yeast exclusion
# would have gutted exactly the queries with 13 NOT-FOUND cards behind them.  An organism is
# off-topic only where the card needs a MAMMALIAN CELL value (counts, densities, geometry).
# ---------------------------------------------------------------------------------------------

defaults:
  # Never about our object under any query: condensed-matter physics and clinical electrophysiology.
  # Both collide on single words ("wave", "density", "complex", "spin") rather than on meaning.
  off_topic:
    - many-body localization
    - non-Hermitian
    - charge density wave
    - spin wave
    - ferromagnetic
    - antiferromagnetic
    - soliton
    - superconducting
    - plasmonic
    - photonic crystal
    - electroencephalogram
    - electroencephalography
    - EEG
    - epilepsy
    - epileptology
    - seizure
    - electrocardiographic
    - electrocardiogram
    - post-stroke
    - myocardial infarction

