- id: AC-bleb-settled-kxb-1
  desc: 'Blebbistatin sweep point k_xb=1 pN/um at FULL NATIVE (70,686 filaments / 494,802 actin nodes / 8,840
    heads, membrane subdiv 7). STATIONARY at 1,160 steps / 55.5 min; gamma_total 49.8001 +/- 0.0132 — another
