- id: AC-bleb-dt-independence-refuted
  desc: 'dt-INDEPENDENCE TEST at the one physiological dose (k_xb=100, 5.0 nm working stroke), FULL NATIVE
    (70,686 filaments / 494,802 actin nodes / 8,840 heads, subdiv 7). PREDICTION DECLARED AND COMMITTED BEFORE
    THE RUN: gamma(dt=0.005) equals 3.4807 within 3 combined sems. REFUTED — gamma(dt=0.005) = 3.1998 +/-
    0.0011 against 3.4807 +/- 0.0017, a 137 sigma / 8.07% difference, both STATIONARY over comparable physical
    time (8.8 s vs 8.0 s) so not a duration artifact. dt = 0.01 IS NOT TIME-CONVERGED. The shift is NOT in the
    kinetics: gamma_network moves 8.13% while bound_fraction moves 0.25% and gamma_source 1.16%, so the entire
    dt dependence sits in the mechanical relaxation term. CONSEQUENCE: every gamma measured in this sweep
    carries an ~8% dt error at the dose where it has been measured, and this is NOT covered by the "R is a
    ratio so it survives the PI-GAPs" argument — a ratio only survives an error that CANCELS, and nothing
    shows the dt error is equal at two different k_xb. The lane cannot quote gamma RATIOS either until dt
    convergence is established. NOT AFFECTED: the engine-cortex A/B and the cross-build parity are comparisons
    at the SAME dt and stand as reported. Also moves ROADMAP stage 2 further away, since stage 2 asks for dt to
    be RAISED and dt cannot be raised from an unconverged point.'
  artifact: aleph/outputs/ac/bleb_settled/kxb_100_dt0005/record.json
  metric: n/a
  expect:
    field: measurements.stationarity.gamma_total_pn_per_um.verdict
    value: STATIONARY
  repro: gpu
  declared: gpu-unreproduced
  covers: []
- id: AC-bleb-dt-cause-is-outer-integrator
  desc: 'SEPARATING run for the dt non-convergence, FULL NATIVE (70,686 filaments / 494,802 actin nodes, subdiv
    7, k_xb=100). Two readings of the 8.07% dt shift were possible and were declared before the run: (A)
    relaxation depth — halving dt doubles inner iterations per physical second, so the reported tension would
    contain unrelaxed residual; (B) outer integrator order. This run holds dt=0.01 and doubles --outer 40 -> 80,
    matching (A) relaxation budget WITHOUT changing dt. RESULT: (B). Doubling the budget moved gamma_total by
    6.0e-08 RELATIVE (3.4807438591 -> 3.4807439934) while halving dt moved it 8.07%. The flag is plumbed and the
    work was done — inner iterations 32,000 -> 64,000, wall x1.59 — and max|PF| DID improve 0.5291 -> 0.4998
    (5.5%), so the residual falls with more iterations while gamma does not move. bound_fraction and n_bound are
    bit-identical. TWO CONSEQUENCES: (1) gamma is NOT reading unrelaxed residual, which is direct evidence for a
    conclusion previously argued only from max|PF| staying flat — a weak argument that happened to reach the
    right answer; (2) the dt dependence lives in the OUTER physical-time integration, not the inner mechanical
    solve, which matters because this lane convergence work has all been inner-solver conditioning (multigrid,
    preconditioners, IMEX step scale) and none of it addresses this. Convergence ORDER is still unknown — two dt
    points cannot give one — and a third point at dt=0.0025 is queued with both predictions declared (first
    order 3.0594, second order 3.1296, ~47 sigma apart).'
  artifact: aleph/outputs/ac/bleb_settled/kxb_100_outer80/record.json
  metric: n/a
  expect:
    field: measurements.stationarity.gamma_total_pn_per_um.verdict
    value: STATIONARY
  repro: gpu
  declared: gpu-unreproduced
  covers: []
- id: AC-bleb-dt-order-undefined
  desc: 'THIRD dt point (dt=0.0025) at the one physiological dose k_xb=100, FULL NATIVE. Both predictions were
    committed BEFORE the run — first order 3.0594, second order 3.1296, ~47 sigma apart — and BOTH ARE
    REFUTED: measured 3.4148. The run also exposed a DETECTOR DEFECT that had to be fixed before the number
    could be read: equilibration_point maximises n_eff = T/(2*tau_int) and chose start=0 on a series that rose
    0.8 -> 3.4 in 0.5 s then sat flat for 7 s, so the steady-state mean was taken ACROSS the rise (3.373, std
    0.2538) instead of over the plateau (3.415, std 0.0106). It self-reinforced: the drift verdict is
    |drift| < sigma*std, so inflating std with the transient makes the test EASIER to pass, and the run was
    certified STATIONARY at 0.94 sigma. Guard added (window_opens_on_a_transient): leading tenth vs trailing
    tenth of the retained window, normalised by the TRAILING tenth so it cannot inherit the same loop; reads
    0.0 / 0.8 / 33.5 on the three runs. Re-measured on an identical t>=2.0 s window (each run had auto-selected
    a different transient — 0.40 / 1.30 / 0.00 s — so the comparison had not been like-for-like) the sequence
    is 3.4813 -> 3.2003 -> 3.4148: NOT MONOTONE. No convergence order fits and Richardson extrapolation does
    not apply, so the earlier "the dt=0.01 values are 10-19% high" is RETRACTED — the true dt->0 value is
    unknown, which strengthens (c) 17 rather than weakening it: an error of unknown size and sign cannot be
    corrected for.'
  artifact: aleph/outputs/ac/bleb_settled/kxb_100_dt00025/record.json
  metric: n/a
  expect:
    field: config.dt_phys
    value: 0.0025
  repro: gpu
  declared: gpu-unreproduced
  covers: []
- id: inner-budget-down-sweep
  desc: 'n_inner DOWNWARD sensitivity at full native (70,686 filaments, 5 budgets x 3 seeds, 30 accepted steps,
    dt=0.01, RTX 4090-1). PRE-REGISTERED before the run (outputs/ac/inner_budget/PREREGISTRATION.md, a3abe347).
    Declared verdict: lowest INSENSITIVE budget = 40, i.e. cut nothing. The up-control (--outer 80) came back
    SENSITIVE TOO, so the rule failed its own control — the across-seed scatter at the reference is 1.09e-4 pN =
    0.014% of the value, two orders tighter than the 1.95% gamma scatter STATE.md''s MEASUREMENT RULE was written
    from. The rule was NOT re-thresholded after seeing the data; that an across-seed band is the wrong band for
    this observable is recorded as one of the run''s outputs. The MAGNITUDES (the declared primary observable)
    show a knee: relative to --outer 40, 80 is -0.59%, 20 is +0.32%, 10 is +5.37%, 5 is +15.00% — flat from 80
    down to 20, steep below. This REFUTES the working hypothesis that 40 -> 5 was nearly free and worth 4-8x;
    what survives is 40 -> 20 at +0.32%. COST is not from this sweep and cannot be (telemetry at the default
    --gamma-every 1 dominates the wall-clock: 6.7% for a 16x budget change); from the committed telemetry-light
    profile instead — inner work is 84.2% of the outer step — halving the budget is ~1.7x. NOT a convergence
    claim (nothing converges, (c) 4), NOT a speed number (every record is timing.comparable false), NOT a new
    production default (a PI call), and NO gamma in magnitude or ratio form ((c) 17). Provenance: the records
    carry no build commit (the driver has no --commit flag and the host is not a checkout); 120/120 closure files
    were hash-matched before launch, and a file in that closure was re-synced after run 6 of 15 — no executed
    code differs, since both changed hunks sit in functions this driver never calls.'
  artifact: aleph/outputs/ac/inner_budget/native_record.json
  metric: n/a
  expect:
    field: result.lowest_insensitive_outer
    value: 40
  repro: gpu
  declared: gpu-unreproduced
- id: inner-budget-down-sweep-report
  desc: 'REPORT.md for the pre-registered n_inner DOWNWARD sweep. Its headline numbers are the same ones declared
    under inner-budget-down-sweep, whose expect block checks them against the record on disk; this entry exists so
    the REPORT itself is covered rather than sitting in the ratchet debt. Headlines: lowest INSENSITIVE budget 40
    (the declared rule says cut nothing, and its up-control failed too); the observable knee -0.59% / +0.32% /
    +5.37% / +15.00% at --outer 80 / 20 / 10 / 5 against 40; and the ~1.7x cost figure, which comes from the
    committed telemetry-light profile and NOT from this sweep. No convergence claim, no engine speed number, no
