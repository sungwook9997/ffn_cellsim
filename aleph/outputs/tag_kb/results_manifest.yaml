    10->3->1, while EVERY force falls monotonically (max|PF| 0.573->0.370, maxF_cortex 6.52->1.91). CAUSE, and it
    was already written down: ac/motor/minifilament_topology.working_stroke_strain calls itself "the k_xb
    MASTER-knob arbiter" and states that k_xb=1 pN/um gives a strain larger than the whole minifilament so the
    stall geometry collapses. At f_stall=0.5 pN/head the swept doses imply working strokes of 0.5 / 5.0 / 50 /
    167 / 500 nm against a physiological 5-20 nm — only k_xb=100 is inside, the exponent flips exactly where the
    stroke leaves the window, and at k_xb=1 the strain (500 nm) exceeds the head offset itself (200 nm). The
    two-regime shape is therefore a property of running the model OUTSIDE its declared domain, not a prediction.
    NO R MAY BE QUOTED FROM THIS SWEEP, for two reasons that are not statistical: only one dose is inside the
    validity window, and k_xb is the wrong knob for blebbistatin anyway (bound fraction is 98.2-98.3% at every
    dose, whereas blebbistatin lowers duty ratio and stall force). k_xb is also a COMPOUND knob — backbone_warp
