- id: AC-stationarity-kxb1000-timescale-separation
  desc: 'Stage 0.5, FULL NATIVE (70,686 filaments / 674,314 nodes / 8,840 heads), 1,500 steps = 15.0 s physical = 10.3 bound-head
    lifetimes: all four observables STATIONARY under a contract declared before the run (window >= 5x driving tau, |drift|
    < 1 sigma; drift came out 0.24 sigma). gamma_total settles at 4.3256 +/- 0.00047 (sem from INDEPENDENT samples). The finding
    is the timescale separation: tau_int(gamma) is at the estimator floor sample_dt/2, i.e. the series is already uncorrelated
    at one 0.05 s sample, so it is an UPPER BOUND and gamma decorrelates >=54x FASTER than the 1.456 s driving bound-head
    lifetime — refuting the assumption written into observe/stationarity.py that collective relaxation is slower than its
    driver. MAGNITUDES ARE NOT QUOTABLE: every NMII parameter is a PI-GAP, QuantitativeClaim is BLOCKED, every step is force-accepted
    (accepted_d = ones) so this is the stationarity of a force-accepted trajectory and not of a mechanically balanced cortex,
    and the STATIONARY verdicts are recorded rather than scored because the gate amendment is unratified.'
  artifact: aleph/outputs/ac/stationarity/kxb1000_tau/record.json
  metric: n/a
  expect:
    field: measurements.stationarity.gamma_total_pn_per_um.verdict
    value: STATIONARY
