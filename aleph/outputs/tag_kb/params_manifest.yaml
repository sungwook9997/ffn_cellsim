# params_manifest.yaml — the declarative contract of the simulation CONSTANTS.
#
# The PARAMETERS-side twin of the citation list (verify_sources) and the headline
# results list (verify_runs). It serves the HARD rule "no empirical magic numbers"
# by declaring, for each constant LISTED BELOW, where it lives on disk, its value,
# its KU anchor, and the SourceEvidence citation_key that anchors it.
# verify_params.py checks each against the config value on disk + the committed
# citation audit; DISK OVERRIDES THE CLAIM (downgrade-only); a claim whose disk
# verdict is WORSE than declared is a DRIFT and FAILS the CI gate.
# Honestly-declared pending constants stay GREEN.
#
# WHAT THIS FILE DOES *NOT* GUARANTEE (corrected 2026-07-25 — the previous header
# asserted "every KU-tagged physical constant the simulator runs on is declared
# here", which was FALSE). Scope of the claims below, measured 2026-07-25:
#   * all 42 rows point at aleph/validation/oracles/configs/phase1_unit*.yaml —
#     retired v1 oracle configs that NO runtime path reads;
#   * the live runtime config tree aleph/configs/** holds 71 KU-tagged numeric
#     constants, of which this file declares ZERO;
#   * parameters that live in Python (ac/engine, ac/cell, ff/, dcm/ defaults and
#     dataclass fields) are outside this file's reach entirely.
# The undeclared set is therefore NOT invisible: it is enumerated in
# coverage_baseline.yaml, counted on every `make kb-check` by kb_coverage.py, and
# ratcheted so it can only shrink. Adding a row here is what removes a debt line.
#
# GENERATED by _migrations/gen_params_manifest.py from the oracle configs +
# KU->source links resolved from the Notion Contract-Graph (2026-06-20). To widen
# coverage or re-anchor a KU, edit the map in that script and re-run, or hand-edit
# a single claim here. Excluded: discretization (beads_per_fiber), validation/
# acceptance thresholds + test fixtures, sim-control, documentation labels.
#
# Fields: id | desc | config | key (dotted) | value | unit | ku | citation_key |
#         declared (verified|source-unverified|source-suspect|unsourced)

