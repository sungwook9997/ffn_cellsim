name: CI

# First automated correctness gate for ffn_cellsim (added 2026-06-19).
#
# Why this exists: the repo had ZERO CI and no GitHub remote — every "done /
# passes / validated" claim was hand-run, and GPU results left no reproducible
# trace. This gate makes "the suite imports cleanly + the CPU tests pass" a
# machine-checked fact on every push, so a green checkmark means something.
#
# Scope (honest): this is the CPU gate. GPU/cupy tests auto-skip on the CPU
# runner (importorskip('cupy')); the native CUDA plugin and GPU bit-parity are
# NOT covered here (they need a CUDA runner — tracked separately). The two
# long-running DCM Simulation-build parity tests are excluded to keep the gate
# bounded; a per-test timeout backstops any other hang.

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-tests:
    name: CPU tests (HOOMD 7.0.1, conda-forge)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up micromamba env (HOOMD + scientific stack)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: ffn_sim
          condarc: |
            channels:
              - conda-forge
            channel_priority: strict
          create-args: >-
            hoomd=7.0.1
            freud
            gsd
            numpy>=2.0
            scipy>=1.13
            h5py
            pyyaml
            matplotlib
            pytest>=8
            pytest-timeout

      # No editable install: `python -m pytest` from the repo root puts cwd on
      # sys.path so `import ffn_sim` resolves. This also sidesteps pyproject's
      # requires-python>=3.13 gate (conda-forge resolves HOOMD 7.0.1 onto py3.12
      # on the runner); the tests run fine there.
      - name: Import / collection gate (suite must import cleanly)
        run: python -m pytest --collect-only -q

      - name: CPU test gate
        run: |
          python -m pytest ffn_sim/tests \
            --timeout=300 -p no:cacheprovider \
            --ignore=ffn_sim/tests/test_dcm_fused_parity.py \
            --ignore=ffn_sim/tests/test_dcm_active_vec_parity.py

  lint:
    name: ruff (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github

  # Results-integrity gate — the teeth of the RAG/TAG results audit. Fast,
  # blocking, no HOOMD: checks every headline result-claim in
  # ffn_sim/outputs/tag_kb/results_manifest.yaml against committed disk artifacts.
  # FAILS if any claim's disk verdict is worse than its declared level (an
  # over-claim): a forbidden basal-footprint A/A0 metric, a value drift, or a
  # claimed artifact that isn't committed. This is what stops the 2026-06-19
  # drift class (PNG-title numbers, forbidden-metric REPORTs) from recurring.
  results-gate:
    name: results-integrity gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pyyaml
      - name: verify result-claims vs committed disk artifacts
        run: python ffn_sim/outputs/tag_kb/verify_runs.py --gate
