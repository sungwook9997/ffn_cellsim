# Production Lam4 — 5k cells × 80 sim hr (~PI experimental duration).
# PI directive 2026-04-29: A/A₀ absolute-value time-budget vs mechanism-
# missing diagnostic. Phase 4-v2 best phenotype (Lam4 R drift 0.073 at
# pilot 4 hr, A/A₀_topdown 2.657). Production scale tests whether the
# pilot result was time-bound or mechanism-bound.
#
# All physics inherited from Phase 4-v2 (commit 708b44d). Only
# computational scale changes: 5× particles, 20× duration.
#
# Per docs/production_lam4_sanity.md and docs/production_lam4_outcomes.md.

run:
  name: production_lam4
  seed: 42
  output_dir: results/production_lam4
  staircase_step: 1

gpu:
  backend: cuda
  device_memory_GB: 12

simulation:
  n_material_points: 5000
  domain_size_um: 600.0
  dx_um: 4.0
  dt_s: 0.02
  total_sim_time_s: 288000.0
  frame_interval_s: 900.0
  diagnostic_interval_steps: 1000

layers:
  L1_bulk_hydrodynamics: true
  L2_boundary_biology: true
  L3_adhesion_phi: true
  L4_internal_flow: true
  L5_mechano_osmotic: true
  L6_chemistry_necrosis: true

physics:
  density_kg_m3: 1050.0
  cortical_K_Pa: 1000.0
  shear_mu_Pa: 300.0
  maxwell_tau_s: 60.0
  cohesive_gamma_J_m2: 1.0e-3

substrate:
  enabled: true
  n_contact_band: 3
  gamma_sub_alpha: 1.0

layer2:
  zeta_star: 0.0

layer3:
  enabled: true
  phi_initial: 0.80
  k_plus_star: 1.39e-3
  k_minus_star: 4.6e-4
  zeta_min: 0.1
  zeta_max: 0.6

layer4:
  enabled: true
  gamma_max_star: 0.020
  gamma_min_star: 0.003
  layer3_spatial_S: true

layer5:
  enabled: true
  rho_osm_initial: 1.0
  alpha_osm_star: 8.33e-3
  beta_osm_star: 0.1
  rho_osm_min: 0.5
  rho_osm_max: 1.6

layer6:
  enabled: true
  alpha_mmp_star: 1.0e-4
  beta_deg_star: 2.0e-3
  ecm_strength_initial: 1.0
  ecm_strength_min: 0.1

gravity:
  gravity_star: 0.01

nondim:
  K_star: 1.0
  mu_star: 0.3
  tau_star: 1.0
  capillary_number: 0.01
  drag_xi_star: 1.0
  density_star: 1.0
  dt_star: 0.01
  total_time_star: 4800.0
  frame_interval_star: 15.0
  domain_star: 6.0
  radius_star: 1.0

numerics:
  scheme: overdamped_mlsmpm
  constitutive_integrator: exponential
  free_surface_detection: density
  free_surface_density_threshold: 0.6
  surface_tension_model: csf_grid
  background_grid_resolution: 64

initialization:
  shape: sphere
  radius_um: 100.0
  pack: poisson_disk_random

gate:
  mass_drift_rel_max: 1.0e-9
  momentum_drift_rel_max: 1.0e-3   # legacy ratio (info only post Week 2)
  momentum_drift_abs_max: 2.0e-3   # Option F Week 2 absolute |Δp_xy| limit
  energy_increase_tol_rel: 1.0e-3
  vram_peak_gb_max: 12.0
  step_time_scaling_tol: 1.5
  sphericity_min: 0.95              # Stage 1a free-floating only
  sphericity_min_post_spread: 0.70  # Option F Week 2 stage-aware threshold
  sphericity_check_after_s: 600.0
  radius_drift_rel_max: 0.05
  radius_drift_check_after_s: 600.0
  max_speed_over_vrms: 10.0
  v15_R_drift_baseline: 0.244
  stage1a_plus_beta_alpha1_R_drift_baseline: 0.247
  stage1c_R_drift_baseline: 0.138
  stage1d_R_drift_baseline: 0.147
  stage2_R_drift_baseline: 0.127
  phase4_v2_lam4_R_drift_baseline: 0.073
