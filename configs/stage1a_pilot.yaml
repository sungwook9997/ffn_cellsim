# Stage 1a-pilot — staircase step 1 of 4.
# Goal: code skeleton verification + baseline step-rate measurement.
# 1,000 material points × 4 sim hours, wall-clock ≤ 30 min on Laptop A5000.
# Gate: conservation drift, step-time baseline, no NaN, sphericity ≥ 0.95.

run:
  name: stage1a_pilot
  seed: 42
  output_dir: results/stage1a_pilot
  staircase_step: 1                # used by runner.py to enforce gate ordering

gpu:
  backend: cuda
  device_memory_GB: 4              # generous for 1k-point pilot; pinned to avoid Taichi re-malloc

simulation:
  n_material_points: 1000
  domain_size_um: 600.0
  dx_um: 4.0                       # 150 cells per axis ≈ 3.4M grid voxels — fits comfortably
  dt_s: 0.02
  total_sim_time_s: 14400.0        # 4 sim hours
  frame_interval_s: 600.0          # 10 sim min — denser than production so drift curves are visible
  diagnostic_interval_steps: 100   # invariants logged every N inner steps

layers:
  L1_bulk_hydrodynamics: true
  L2_boundary_biology: false
  L3_adhesion_phi: false
  L4_internal_flow: false
  L5_mechano_osmotic: false
  L6_chemistry_necrosis: false

physics:
  # Stage 1a uses overdamped + dimensionless scheme (see docs/v1/stage1a_assumption_review.md).
  # Reference units: length = R0 (radius_um below), time = tau_relax_s, stress = K_Pa.
  # Physical placeholders below are RESTORATION targets for the Stage 1a → 1a+ anchor pass;
  # the solver consumes the dimensionless block (`nondim`).
  density_kg_m3: 1050.0            # ρ ≈ 1.05 g/cm³           — TODO[anchor]
  cortical_K_Pa: 1000.0            # K = 1 kPa (effective bulk) — TODO[anchor]
  shear_mu_Pa: 300.0               # μ deviatoric, mid-range epithelial — TODO[anchor]
  maxwell_tau_s: 60.0              # τ relaxation              — TODO[anchor]
  cohesive_gamma_J_m2: 1.0e-3      # γ_cc = 1 mJ/m² ⇒ Ca = γ/(K·R₀) = 0.01 — TODO[anchor]

nondim:
  # All numbers fed to the solver are dimensionless. The mapping back to SI uses
  # the `physics` block above and is exercised in tests/test_units_roundtrip.
  K_star: 1.0                      # K rescaled to 1 by definition of stress unit
  mu_star: 0.3                     # μ/K = 0.3 (mid-range epithelial)
  tau_star: 1.0                    # τ rescaled to 1 by definition of time unit
  capillary_number: 0.01           # Ca = γ/(K·R₀); SWEEP-EXPOSED in Stage 1 final.
                                   # Pilot uses the BASELINE Ca (centre of the planned
                                   # 0.001–0.1 sweep range). Pilot must validate the
                                   # scheme at the baseline; sweep variants are tested
                                   # later in Stage 1 final. Do NOT shift Ca for the
                                   # pilot to make a gate pass — surface failures to
                                   # the PI instead.
  drag_xi_star: 1.0                # overdamped: ξ·v = F, ξ* ≡ 1 in dimensionless units
  density_star: 1.0                # appears only in mass diagnostics; ρ* ≡ 1
  dt_star: 0.01                    # = dt_s / tau_relax_s ; verified against gate in code
  total_time_star: 240.0           # = 4 sim hr / 60 s = 240 τ-units
  frame_interval_star: 10.0        # = 600 s / 60 s
  domain_star: 6.0                 # box side = 6·R₀
  radius_star: 1.0

numerics:
  scheme: overdamped_mlsmpm                  # ξv = F, no inertia; see assumption A1
  constitutive_integrator: exponential       # closed-form Maxwell, unconditionally stable
  free_surface_detection: density            # density-based boundary tagging
  free_surface_density_threshold: 0.6        # boundary iff ρ̂_p < 0.6·ρ_bulk
  surface_tension_model: csf_grid            # Brackbill 1992 CSF on background grid
  background_grid_resolution: 64             # 64³ — stress-tested upward in burn-in

initialization:
  shape: sphere
  radius_um: 100.0                 # MCF7 spheroid R ≈ 100 μm — placeholder
  pack: poisson_disk_random        # blue-noise random pack inside the sphere

gate:
  # Tolerances applied at the staircase PASS/FAIL gate.
  mass_drift_rel_max: 1.0e-10
  momentum_drift_rel_max: 1.0e-3
  energy_increase_tol_rel: 1.0e-3
  vram_peak_gb_max: 12.0
  step_time_scaling_tol: 1.5       # t_step(N)/t_step(1000) ≤ this · N/1000
  sphericity_min: 0.95
  sphericity_check_after_s: 600.0  # check after 10 sim min (≈ τ_relax)
  radius_drift_rel_max: 0.05       # |R(t)/R₀ − 1| ≤ 5% after relaxation transient
  radius_drift_check_after_s: 600.0
  max_speed_over_vrms: 10.0        # numerical-stability sanity check
