# Production config — Stage 1 final 5-point sweep target.
# 5,000 material points × 80 sim hours, wall-clock 5–15 hr per run.

run:
  name: production
  seed: 2026
  output_dir: results/production

gpu:
  backend: cuda
  # 16 GB A5000 Laptop ceiling — production may need to migrate to RTX 4090×2 (24 GB each)
  # or Colab A100 (40 GB) for larger configurations. See docs/11_performance_protocol.md.
  device_memory_GB: 12

simulation:
  n_material_points: 5000
  domain_size_um: 1000.0
  dx_um: 4.0
  dt_s: 0.02
  total_sim_time_s: 288000.0     # 80 sim hours
  frame_interval_s: 900.0        # 15 sim min — production imaging cadence

# All Stage-1 layers active in the production sweep.
layers:
  L1_bulk_hydrodynamics: true
  L2_boundary_biology: true
  L3_adhesion_phi: true
  L4_internal_flow: true
  L5_mechano_osmotic: true
  L6_chemistry_necrosis: false   # Stage 2

physics:
  cohesion_strength: null
  cortical_K_Pa: null
  maxwell_tau_s: null
