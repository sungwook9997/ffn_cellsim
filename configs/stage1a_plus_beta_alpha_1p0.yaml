# Stage 1a+ Option β pilot — α = 1.0 (γ_sub = γ_cc).
#
# Sweep variant of configs/stage1a_plus_pilot.yaml. The only physics
# difference vs Option α is `substrate.gamma_sub_alpha` > 0; the runner
# computes γ_sub_star = α · Ca_cc · K_star · radius_star and the solver
# applies the substrate CSF impulse from `_grid_op_overdamped`. See
# docs/v1/stage1a_plus_substrate_sanity.md §"Option β addendum" and
# docs/v1/outcomes_stage1a_plus.md §"Option β addendum".

run:
  name: stage1a_plus_beta_alpha_1p0
  seed: 42
  output_dir: results/stage1a_plus_beta_alpha_1p0
  staircase_step: 1

gpu:
  backend: cuda
  device_memory_GB: 4

simulation:
  n_material_points: 1000
  domain_size_um: 600.0
  dx_um: 4.0
  dt_s: 0.02
  total_sim_time_s: 14400.0
  frame_interval_s: 600.0
  diagnostic_interval_steps: 100

layers:
  L1_bulk_hydrodynamics: true
  L2_boundary_biology: false
  L3_adhesion_phi: false
  L4_internal_flow: false
  L5_mechano_osmotic: false
  L6_chemistry_necrosis: false

physics:
  density_kg_m3: 1050.0
  cortical_K_Pa: 1000.0
  shear_mu_Pa: 300.0
  maxwell_tau_s: 60.0
  cohesive_gamma_J_m2: 1.0e-3

substrate:
  enabled: true
  n_contact_band: 3
  gamma_sub_alpha: 1.0             # γ_sub = α · γ_cc; α anchored to Ca_cc (Maître 2012)

nondim:
  K_star: 1.0
  mu_star: 0.3
  tau_star: 1.0
  capillary_number: 0.01
  drag_xi_star: 1.0
  density_star: 1.0
  dt_star: 0.01
  total_time_star: 240.0
  frame_interval_star: 10.0
  domain_star: 6.0
  radius_star: 1.0

numerics:
  scheme: overdamped_mlsmpm
  constitutive_integrator: exponential
  free_surface_detection: density
  free_surface_density_threshold: 0.6
  surface_tension_model: csf_grid
  background_grid_resolution: 64

initialization:
  shape: sphere
  radius_um: 100.0
  pack: poisson_disk_random

gate:
  mass_drift_rel_max: 1.0e-10
  momentum_drift_rel_max: 1.0e-3
  energy_increase_tol_rel: 1.0e-3
  vram_peak_gb_max: 12.0
  step_time_scaling_tol: 1.5
  sphericity_min: 0.95
  sphericity_check_after_s: 600.0
  radius_drift_rel_max: 0.05
  radius_drift_check_after_s: 600.0
  max_speed_over_vrms: 10.0
  v15_R_drift_baseline: 0.244
