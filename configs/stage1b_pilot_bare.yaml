# Stage 1b 3-phenotype pilot — Bare initial condition.
#
# Carrier: Layer 1 v15 + Stage 1a+ Option β α=1.0 + Stage 1a++ Layer 2
# active stress with φ-modulated ζ (ζ ∈ [0.1, 0.4] from Track 1 stable
# regime). Layer 3 φ-ODE active per Cho et al. 2020 mechanism (rate
# constants from docs/03_adhesion_dynamics.md). PI full authorisation
# 2026-04-29 for Bare/Pre/Lam4 → φ_initial mapping (PI domain expertise).
# All three phenotype runs use IDENTICAL substrate (Col1) — variation is
# in the spheroid initial state only (formation environment phenotype).
# See docs/stage1b_layer3_sanity.md and docs/SESSION_HANDOFF.md
# §"Stage 1b framing memo".

run:
  name: stage1b_pilot_bare
  seed: 42
  output_dir: results/stage1b_pilot_bare
  staircase_step: 1

gpu:
  backend: cuda
  device_memory_GB: 4

simulation:
  n_material_points: 1000
  domain_size_um: 600.0
  dx_um: 4.0
  dt_s: 0.02
  total_sim_time_s: 14400.0
  frame_interval_s: 600.0
  diagnostic_interval_steps: 100

layers:
  L1_bulk_hydrodynamics: true
  L2_boundary_biology: true
  L3_adhesion_phi: true
  L4_internal_flow: false
  L5_mechano_osmotic: false
  L6_chemistry_necrosis: false

physics:
  density_kg_m3: 1050.0
  cortical_K_Pa: 1000.0
  shear_mu_Pa: 300.0
  maxwell_tau_s: 60.0
  cohesive_gamma_J_m2: 1.0e-3

substrate:
  enabled: true
  n_contact_band: 3
  gamma_sub_alpha: 1.0

layer2:
  zeta_star: 0.0   # Layer 3 overrides via ζ(φ); set 0 explicitly for clarity

layer3:
  enabled: true
  phi_initial: 0.30
  k_plus_star: 1.39e-3      # = τ_relax / 12 hr (Cho 2020 transition timescale)
  k_minus_star: 4.6e-4      # = k_+/3 → φ_eq = 0.75
  zeta_min: 0.1             # Track 1 stable regime lower edge
  zeta_max: 0.4             # Track 1 stable regime upper edge

nondim:
  K_star: 1.0
  mu_star: 0.3
  tau_star: 1.0
  capillary_number: 0.01
  drag_xi_star: 1.0
  density_star: 1.0
  dt_star: 0.01
  total_time_star: 240.0
  frame_interval_star: 10.0
  domain_star: 6.0
  radius_star: 1.0

numerics:
  scheme: overdamped_mlsmpm
  constitutive_integrator: exponential
  free_surface_detection: density
  free_surface_density_threshold: 0.6
  surface_tension_model: csf_grid
  background_grid_resolution: 64

initialization:
  shape: sphere
  radius_um: 100.0
  pack: poisson_disk_random

gate:
  mass_drift_rel_max: 1.0e-10
  momentum_drift_rel_max: 1.0e-3
  energy_increase_tol_rel: 1.0e-3
  vram_peak_gb_max: 12.0
  step_time_scaling_tol: 1.5
  sphericity_min: 0.95
  sphericity_check_after_s: 600.0
  radius_drift_rel_max: 0.05
  radius_drift_check_after_s: 600.0
  max_speed_over_vrms: 10.0
  v15_R_drift_baseline: 0.244
  stage1a_plus_beta_alpha1_R_drift_baseline: 0.247
