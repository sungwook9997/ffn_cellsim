# Path C v15 baseline pilot — Layer 1 + Stage 1a+ Option α (mechanical
# substrate, γ_sub = 0) + Path C effective gravity (gravity_star = 0.1).
# Layer 2 / 3 / 4 / 5 / 6 OFF.
#
# This is the DEFAULT-SCOPE Path C single-run baseline per PI directive
# 2026-04-29 ("기본: v15만 re-baseline 후 STOP"). Re-baselining of
# Stage 1a+ Option β / Stage 1a++ / Stage 1b under Path C is deferred
# to PI's explicit decision after the result is surfaced.
#
# See docs/path_c_sanity.md and docs/outcomes_path_c.md.

run:
  name: path_c_v15_baseline
  seed: 42
  output_dir: results/path_c_v15_baseline
  staircase_step: 1

gpu:
  backend: cuda
  device_memory_GB: 4

simulation:
  n_material_points: 1000
  domain_size_um: 600.0
  dx_um: 4.0
  dt_s: 0.02
  total_sim_time_s: 14400.0
  frame_interval_s: 600.0
  diagnostic_interval_steps: 100

layers:
  L1_bulk_hydrodynamics: true
  L2_boundary_biology: false
  L3_adhesion_phi: false
  L4_internal_flow: false
  L5_mechano_osmotic: false
  L6_chemistry_necrosis: false

physics:
  density_kg_m3: 1050.0           # Stewart Nature 2011 IF 65 (cell density)
  cortical_K_Pa: 1000.0
  shear_mu_Pa: 300.0
  maxwell_tau_s: 60.0
  cohesive_gamma_J_m2: 1.0e-3

substrate:
  enabled: true
  n_contact_band: 3
  gamma_sub_alpha: 0.0            # Option α: mechanical substrate only

# Path C effective gravity (anchored to Stewart Nature 2011 IF 65 for
# cell density framework; specific value framed as body-force coefficient
# under overdamped ξ_star = 1 calibration per Magic-Number Block PARTIAL
# resolution — see docs/path_c_sanity.md).
gravity:
  gravity_star: 0.1               # provisional default; PI authorisation 2026-04-29

nondim:
  K_star: 1.0
  mu_star: 0.3
  tau_star: 1.0
  capillary_number: 0.01
  drag_xi_star: 1.0
  density_star: 1.0
  dt_star: 0.01
  total_time_star: 240.0
  frame_interval_star: 10.0
  domain_star: 6.0
  radius_star: 1.0

numerics:
  scheme: overdamped_mlsmpm
  constitutive_integrator: exponential
  free_surface_detection: density
  free_surface_density_threshold: 0.6
  surface_tension_model: csf_grid
  background_grid_resolution: 64

initialization:
  shape: sphere
  radius_um: 100.0
  pack: poisson_disk_random

gate:
  mass_drift_rel_max: 1.0e-10
  momentum_drift_rel_max: 1.0e-3
  energy_increase_tol_rel: 1.0e-3
  vram_peak_gb_max: 12.0
  step_time_scaling_tol: 1.5
  sphericity_min: 0.95
  sphericity_check_after_s: 600.0
  radius_drift_rel_max: 0.05
  radius_drift_check_after_s: 600.0
  max_speed_over_vrms: 10.0
  v15_R_drift_baseline: 0.244
  stage1a_plus_beta_alpha1_R_drift_baseline: 0.247
