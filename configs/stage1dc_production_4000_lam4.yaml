# Stage 1b.b Pilot 2 ??Production Lam4 5k 횞 80hr with Layer 3 ?_memory
# + c_act split (per docs/v1/layer3_phi_audit.md 짠6 + PI directive
# 2026-04-29). Tests whether the pre-fix peak-and-decay (top-down
# 1.570 at 7.75hr ??1.409 at 80hr) was contaminated by the Layer 3
# formulation bug. Pilot 1 (1k Lam4 4hr) gave A/A?_topdown peak 4.28
# vs pre-fix 2.657 ??+60% improvement at pilot scale.
#
# Bucketing per audit 짠6:
#   L3-A (??4.0): Layer 3 fix alone closes most of gap ??paper-as-is
#   L3-B [2.5, 4.0): partial ??Stage 1d.b authorized
#   L3-C [1.5, 2.5): minor ??Stage 1d.b + Stage 1a++.b sequenced
#   L3-D (< 1.5): no improvement ??full Mechanism A/E/F warranted

run:
  name: stage1dc_production_4000_lam4
  seed: 42
  output_dir: results/stage1dc_production_4000_lam4
  staircase_step: 1

gpu:
  backend: cuda
  device_memory_GB: 12

simulation:
  n_material_points: 4000
  domain_size_um: 600.0
  dx_um: 4.0
  dt_s: 0.02
  total_sim_time_s: 288000.0
  frame_interval_s: 900.0
  diagnostic_interval_steps: 1000

layers:
  L1_bulk_hydrodynamics: true
  L2_boundary_biology: true
  L3_adhesion_phi: true
  L4_internal_flow: true
  L5_mechano_osmotic: true
  L6_chemistry_necrosis: true

physics:
  density_kg_m3: 1050.0
  cortical_K_Pa: 1000.0
  shear_mu_Pa: 300.0
  maxwell_tau_s: 60.0
  cohesive_gamma_J_m2: 1.0e-3

substrate:
  enabled: true
  n_contact_band: 3
  gamma_sub_alpha: 1.0

layer2:
  zeta_star: 0.0

# Stage 1a++.b stochastic boundary events (PI directive 2026-04-29).
# Conservative production values: 貫=0.02 (1.2/min/cell, mid-low end of
# Mattila & Lappalainen 2008 NRMCB IF 113 lamellipodia rate range
# 1-10/min) + small impulse 0.002 (50pN scale).
layer2_b:
  enabled: true
  lambda_lam_star: 0.02
  impulse_lam_star: 0.002

# Stage 1d.c ECM-mediated communication + protrusion state machine.
# Replaces the one-step stochastic kick when enabled; layer2_b stays in
# config for backwards comparison but is bypassed in solver.step().
layer7:
  enabled: true
  eta_ecm_star: 5.0
  G_ecm_star: 1.0
  lambda_ecm_star: 4.0
  R_dep_star: 1.0
  T0_star: 0.1
  protrusion_speed_cap_star: 0.06
  tau_lam_star: 10.0
  tau_release_star: 5.0
  lambda_filo_star: 0.05
  r_form_star: 0.1
  r_mature_star: 0.05
  alpha_edge_star: 1.0
  beta_ecm_star: 0.5
  beta_traction_star: 0.5
layer3:
  enabled: true
  phi_initial: 0.80
  k_plus_star: 1.39e-3
  k_minus_star: 4.6e-4
  zeta_min: 0.1
  zeta_max: 0.6
  # Stage 1b.b ?_memory + c_act split (PI directive 2026-04-29).
  split: true
  kappa_act: 1.0
  memory_eps_star: 0.0

layer4:
  enabled: true
  gamma_max_star: 0.020
  gamma_min_star: 0.003
  layer3_spatial_S: false   # DEPRECATED under layer3.split=true
  # Stage 1d.b Marangoni Mechanism A + F (PI directive 2026-04-29).
  # Conservative production values: dynamic 款 ON, 慣_A=0.2 + 慣_F=0.1
  # (smaller than Stage 1d.b pilot 慣_A=0.5 / 慣_F=0.3 ??production scale
  # tends to amplify mechanisms; PI sweep will refine).
  dynamic_gamma: true
  tau_gamma_star: 1.0
  alpha_A_star: 0.2
  alpha_F_star: 0.1

layer5:
  enabled: true
  rho_osm_initial: 1.0
  alpha_osm_star: 8.33e-3
  beta_osm_star: 0.1
  rho_osm_min: 0.5
  rho_osm_max: 1.6

layer6:
  enabled: true
  alpha_mmp_star: 1.0e-4
  beta_deg_star: 2.0e-3
  ecm_strength_initial: 1.0
  ecm_strength_min: 0.1

gravity:
  gravity_star: 0.01

nondim:
  K_star: 1.0
  mu_star: 0.3
  tau_star: 1.0
  capillary_number: 0.01
  drag_xi_star: 1.0
  density_star: 1.0
  dt_star: 0.01
  total_time_star: 4800.0
  frame_interval_star: 15.0
  domain_star: 6.0
  radius_star: 1.0

numerics:
  scheme: overdamped_mlsmpm
  constitutive_integrator: exponential
  free_surface_detection: density
  free_surface_density_threshold: 0.6
  surface_tension_model: csf_grid
  background_grid_resolution: 64

initialization:
  shape: sphere
  radius_um: 100.0
  pack: poisson_disk_random

gate:
  mass_drift_rel_max: 1.0e-9
  momentum_drift_rel_max: 1.0e-3   # legacy ratio (info only post Week 2)
  momentum_drift_abs_max: 2.0e-3   # Option F Week 2 absolute |?p_xy| limit
  energy_increase_tol_rel: 1.0e-3
  vram_peak_gb_max: 12.0
  step_time_scaling_tol: 1.5
  sphericity_min: 0.95              # Stage 1a free-floating only
  sphericity_min_post_spread: 0.70  # Option F Week 2 stage-aware threshold
  sphericity_check_after_s: 600.0
  radius_drift_rel_max: 0.05
  radius_drift_check_after_s: 600.0
  max_speed_over_vrms: 10.0
  layer3_memory_drift_max: 0.01    # Stage 1b.b 5a
  layer3_c_act_band_tol: 0.10      # Stage 1b.b 5b
  stage1dc_hull_leverage_max: 1.35
  stage1dc_largest_component_fraction_min: 0.90
  v15_R_drift_baseline: 0.244
  stage1a_plus_beta_alpha1_R_drift_baseline: 0.247
  stage1c_R_drift_baseline: 0.138
  stage1d_R_drift_baseline: 0.147
  stage2_R_drift_baseline: 0.127
  phase4_v2_lam4_R_drift_baseline: 0.073

