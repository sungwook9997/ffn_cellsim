# Stage 1b.b pilot — Layer 3 φ_memory + c_act split (Lam4 1k 4hr).
# Per PI directive 2026-04-29 (docs/v1/layer3_phi_audit.md +
# docs/v1/stage1b_b_phi_split_sanity.md). Tests whether the F9 formulation
# bug (interior φ decay erasing formation phenotype memory) is closed
# by the φ_memory + c_act split. Identical to final_pilot_v2_lam4 except
# `layer3.split: true`, κ=1.0, ε=0.

run:
  name: stage1d_c_pilot_lam4
  seed: 42
  output_dir: results/stage1d_c_pilot_lam4
  staircase_step: 1

gpu:
  backend: cuda
  device_memory_GB: 4

simulation:
  n_material_points: 1000
  domain_size_um: 600.0
  dx_um: 4.0
  dt_s: 0.02
  total_sim_time_s: 14400.0
  frame_interval_s: 600.0
  diagnostic_interval_steps: 100

layers:
  L1_bulk_hydrodynamics: true
  L2_boundary_biology: true
  L3_adhesion_phi: true
  L4_internal_flow: true
  L5_mechano_osmotic: true
  L6_chemistry_necrosis: true

physics:
  density_kg_m3: 1050.0
  cortical_K_Pa: 1000.0
  shear_mu_Pa: 300.0
  maxwell_tau_s: 60.0
  cohesive_gamma_J_m2: 1.0e-3

substrate:
  enabled: true
  n_contact_band: 3
  gamma_sub_alpha: 1.0

layer2:
  zeta_star: 0.0

# Stage 1d.c ECM-mediated communication + protrusion state machine
# (PI directive 2026-04-30 per Codex analysis). Replaces Stage 1a++.b
# one-step impulse with biologically-grounded sustained traction.
# All defaults from docs/v1/stage1d_c_ecm_communication_sanity.md.
layer7:
  enabled: true
  eta_ecm_star: 5.0
  G_ecm_star: 1.0
  lambda_ecm_star: 4.0       # Nahum 2023 mid-range (4-10 cell diameters)
  R_dep_star: 1.0
  T0_star: 0.1               # Balaban / Bergert traction scale
  tau_lam_star: 10.0
  tau_release_star: 5.0
  lambda_filo_star: 0.05
  r_form_star: 0.1
  r_mature_star: 0.05
  alpha_edge_star: 1.0
  beta_ecm_star: 0.5
  beta_traction_star: 0.5
  protrusion_speed_cap_star: 0.06  # ~0.1 um/s at R0=100um, tau=60s

layer3:
  enabled: true
  phi_initial: 0.80
  k_plus_star: 1.39e-3
  k_minus_star: 4.6e-4
  zeta_min: 0.1
  zeta_max: 0.6              # Phase 2.2 first-PASS optimum (was 0.4)
  # Stage 1b.b φ_memory + c_act split (PI directive 2026-04-29).
  split: true                # Enable φ_memory_p + c_act_p separation
  kappa_act: 1.0             # κ (PI default 1.0): full c_act saturation
  memory_eps_star: 0.0       # ε (PI default 0.0): φ_memory exactly fixed

layer4:
  enabled: true
  gamma_max_star: 0.020
  gamma_min_star: 0.003
  layer3_spatial_S: false    # DEPRECATED under layer3.split=true
                             # (intrinsic c_act spatial gating)

layer5:
  enabled: true
  rho_osm_initial: 1.0
  alpha_osm_star: 8.33e-3
  beta_osm_star: 0.1
  rho_osm_min: 0.5
  rho_osm_max: 1.6

layer6:
  enabled: true
  alpha_mmp_star: 1.0e-4
  beta_deg_star: 2.0e-3
  ecm_strength_initial: 1.0
  ecm_strength_min: 0.1

gravity:
  gravity_star: 0.01

nondim:
  K_star: 1.0
  mu_star: 0.3
  tau_star: 1.0
  capillary_number: 0.01
  drag_xi_star: 1.0
  density_star: 1.0
  dt_star: 0.01
  total_time_star: 240.0
  frame_interval_star: 10.0
  domain_star: 6.0
  radius_star: 1.0

numerics:
  scheme: overdamped_mlsmpm
  constitutive_integrator: exponential
  free_surface_detection: density
  free_surface_density_threshold: 0.6
  surface_tension_model: csf_grid
  background_grid_resolution: 64

initialization:
  shape: sphere
  radius_um: 100.0
  pack: poisson_disk_random

gate:
  mass_drift_rel_max: 1.0e-10
  momentum_drift_rel_max: 1.0e-3       # info-only post Option F Week 2
  momentum_drift_abs_max: 2.0e-3       # Option F Week 2 absolute |Δp_xy| limit
  energy_increase_tol_rel: 1.0e-3
  vram_peak_gb_max: 12.0
  step_time_scaling_tol: 1.5
  sphericity_min: 0.95                 # Stage 1a free-floating only
  sphericity_min_post_spread: 0.70     # Option F Week 2 stage-aware threshold
  sphericity_check_after_s: 600.0
  radius_drift_rel_max: 0.05
  radius_drift_check_after_s: 600.0
  max_speed_over_vrms: 10.0
  layer3_memory_drift_max: 0.01        # Stage 1b.b 5a: φ_memory drift limit
  layer3_c_act_band_tol: 0.10          # Stage 1b.b 5b: c_act vs c_eq tol
  stage1dc_hull_leverage_max: 1.35
  stage1dc_largest_component_fraction_min: 0.90
  v15_R_drift_baseline: 0.244
  stage1a_plus_beta_alpha1_R_drift_baseline: 0.247
  stage1c_R_drift_baseline: 0.138
  stage1d_R_drift_baseline: 0.147
  stage2_R_drift_baseline: 0.127
  phase4_v1_lam4_R_drift_baseline: 0.122
