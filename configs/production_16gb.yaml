# Production config — 16 GB BASELINE (RTX A5000 Laptop, primary workstation).
# Stage 1 final 5-point sweep target.
# 5,000 material points × 80 sim hours; wall-clock ~7–20 hr/run on Laptop A5000.
#
# Stage 1a benchmark MUST verify peak VRAM ≤ 12 GB at this point count.
# If it doesn't fit, demote n_material_points here and migrate the original
# size to configs/production_24gb.yaml.

run:
  name: production_16gb
  seed: 2026
  output_dir: results/production_16gb

gpu:
  backend: cuda
  # 16 GB A5000 Laptop ceiling: cap below 12 GB so OS + frame buffers + Taichi
  # runtime keep headroom. Larger sweep variants live in production_24gb.yaml.
  device_memory_GB: 12

simulation:
  n_material_points: 5000
  domain_size_um: 1000.0
  dx_um: 4.0
  dt_s: 0.02
  total_sim_time_s: 288000.0     # 80 sim hours
  frame_interval_s: 900.0        # 15 sim min — production imaging cadence

# All Stage-1 layers active in the production sweep.
layers:
  L1_bulk_hydrodynamics: true
  L2_boundary_biology: true
  L3_adhesion_phi: true
  L4_internal_flow: true
  L5_mechano_osmotic: true
  L6_chemistry_necrosis: false   # Stage 2

physics:
  cohesion_strength: null
  cortical_K_Pa: null
  maxwell_tau_s: null
