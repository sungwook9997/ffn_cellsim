# Production-scale config (NOT executed in Phase 5; PI decision required).
#
# Per docs/00_project_vision.md "Production target: 5,000 material points
# × 80 sim hours" and CLAUDE.md performance budget. PI Outstanding-Issue
# Resolution 2026-04-29: this config is written for review; execution
# requires explicit PI go-ahead with selected scope (single-phenotype Pre,
# 3-phenotype Bare/Pre/Lam4, or extended-time variants).
#
# Wall-clock estimate (Laptop A5000 16 GB):
# - Pilot 1k × 4 hr = ~1-2 min/run
# - Production 5k × 80 hr = ~5k/1k · 80hr/4hr · 1-2 min = ~100-200 min/run
#   = ~2-3 hr per single run. 3-phenotype sweep ~6-9 hr.
# - VRAM peak estimate: ~5 GB for 5k particles + 64³ grid (well within
#   16 GB Laptop A5000 baseline + 12 GB ceiling per CLAUDE.md).
#
# Carrier: full Stage 2 framework (all 6 layers + Path C + Phase 1 fixes).
# Default phenotype: Pre (φ_initial = 0.55). Other phenotypes via
# substituted layer3.phi_initial as in configs/final_pilot_{bare,pre,lam4}.yaml.

run:
  name: production_5k_80hr
  seed: 42
  output_dir: results/production_5k_80hr
  staircase_step: 1

gpu:
  backend: cuda
  device_memory_GB: 12

simulation:
  n_material_points: 5000
  domain_size_um: 600.0
  dx_um: 4.0
  dt_s: 0.02
  total_sim_time_s: 288000.0
  frame_interval_s: 900.0
  diagnostic_interval_steps: 1000

layers:
  L1_bulk_hydrodynamics: true
  L2_boundary_biology: true
  L3_adhesion_phi: true
  L4_internal_flow: true
  L5_mechano_osmotic: true
  L6_chemistry_necrosis: true

physics:
  density_kg_m3: 1050.0
  cortical_K_Pa: 1000.0
  shear_mu_Pa: 300.0
  maxwell_tau_s: 60.0
  cohesive_gamma_J_m2: 1.0e-3

substrate:
  enabled: true
  n_contact_band: 3
  gamma_sub_alpha: 1.0

layer2:
  zeta_star: 0.0

layer3:
  enabled: true
  phi_initial: 0.55
  k_plus_star: 1.39e-3
  k_minus_star: 4.6e-4
  zeta_min: 0.1
  zeta_max: 0.4

layer4:
  enabled: true
  gamma_max_star: 0.020
  gamma_min_star: 0.003
  layer3_spatial_S: true

layer5:
  enabled: true
  rho_osm_initial: 1.0
  alpha_osm_star: 8.33e-3
  beta_osm_star: 0.1
  rho_osm_min: 0.5
  rho_osm_max: 1.6

layer6:
  enabled: true
  alpha_mmp_star: 1.0e-4
  beta_deg_star: 2.0e-3
  ecm_strength_initial: 1.0
  ecm_strength_min: 0.1

gravity:
  gravity_star: 0.01

nondim:
  K_star: 1.0
  mu_star: 0.3
  tau_star: 1.0
  capillary_number: 0.01
  drag_xi_star: 1.0
  density_star: 1.0
  dt_star: 0.01
  total_time_star: 4800.0
  frame_interval_star: 15.0
  domain_star: 6.0
  radius_star: 1.0

numerics:
  scheme: overdamped_mlsmpm
  constitutive_integrator: exponential
  free_surface_detection: density
  free_surface_density_threshold: 0.6
  surface_tension_model: csf_grid
  background_grid_resolution: 64

initialization:
  shape: sphere
  radius_um: 100.0
  pack: poisson_disk_random

gate:
  mass_drift_rel_max: 1.0e-10
  momentum_drift_rel_max: 1.0e-3
  energy_increase_tol_rel: 1.0e-3
  vram_peak_gb_max: 12.0
  step_time_scaling_tol: 1.5
  sphericity_min: 0.95
  sphericity_check_after_s: 600.0
  radius_drift_rel_max: 0.05
  radius_drift_check_after_s: 600.0
  max_speed_over_vrms: 10.0
  v15_R_drift_baseline: 0.244
  stage1a_plus_beta_alpha1_R_drift_baseline: 0.247
  stage1c_R_drift_baseline: 0.138
  stage1d_R_drift_baseline: 0.147
  stage2_R_drift_baseline: 0.127
