# Phase 4-v2 — 3-phenotype final baseline retake (Pre) with zeta_max=0.6.
# Phase 2.2 finding: ζ=0.60 was first R drift gate PASS (0.043, < 0.05
# limit) across 19 prior simulations. Phase 4 retake updates Layer 3
# zeta_max from 0.4 to 0.6, expanding the φ-modulated ζ_eff range:
#   Bare (φ=0.30) → ζ_eff = 0.1 + 0.30·0.5 = 0.25
#   Pre  (φ=0.55) → ζ_eff = 0.1 + 0.55·0.5 = 0.375
#   Lam4 (φ=0.80) → ζ_eff = 0.1 + 0.80·0.5 = 0.50  (Phase 2.2 R drift
#   0.102 stable regime; not at the ζ=0.60 PASS optimum but closer to it)
# Other settings identical to configs/final_pilot_pre.yaml. PI
# decision 2026-04-29.

run:
  name: final_pilot_v2_pre
  seed: 42
  output_dir: results/final_pilot_v2_pre
  staircase_step: 1

gpu:
  backend: cuda
  device_memory_GB: 4

simulation:
  n_material_points: 1000
  domain_size_um: 600.0
  dx_um: 4.0
  dt_s: 0.02
  total_sim_time_s: 14400.0
  frame_interval_s: 600.0
  diagnostic_interval_steps: 100

layers:
  L1_bulk_hydrodynamics: true
  L2_boundary_biology: true
  L3_adhesion_phi: true
  L4_internal_flow: true
  L5_mechano_osmotic: true
  L6_chemistry_necrosis: true

physics:
  density_kg_m3: 1050.0
  cortical_K_Pa: 1000.0
  shear_mu_Pa: 300.0
  maxwell_tau_s: 60.0
  cohesive_gamma_J_m2: 1.0e-3

substrate:
  enabled: true
  n_contact_band: 3
  gamma_sub_alpha: 1.0

layer2:
  zeta_star: 0.0

layer3:
  enabled: true
  phi_initial: 0.55
  k_plus_star: 1.39e-3
  k_minus_star: 4.6e-4
  zeta_min: 0.1
  zeta_max: 0.6              # Phase 2.2 first-PASS optimum (was 0.4)

layer4:
  enabled: true
  gamma_max_star: 0.020
  gamma_min_star: 0.003
  layer3_spatial_S: true

layer5:
  enabled: true
  rho_osm_initial: 1.0
  alpha_osm_star: 8.33e-3
  beta_osm_star: 0.1
  rho_osm_min: 0.5
  rho_osm_max: 1.6

layer6:
  enabled: true
  alpha_mmp_star: 1.0e-4
  beta_deg_star: 2.0e-3
  ecm_strength_initial: 1.0
  ecm_strength_min: 0.1

gravity:
  gravity_star: 0.01

nondim:
  K_star: 1.0
  mu_star: 0.3
  tau_star: 1.0
  capillary_number: 0.01
  drag_xi_star: 1.0
  density_star: 1.0
  dt_star: 0.01
  total_time_star: 240.0
  frame_interval_star: 10.0
  domain_star: 6.0
  radius_star: 1.0

numerics:
  scheme: overdamped_mlsmpm
  constitutive_integrator: exponential
  free_surface_detection: density
  free_surface_density_threshold: 0.6
  surface_tension_model: csf_grid
  background_grid_resolution: 64

initialization:
  shape: sphere
  radius_um: 100.0
  pack: poisson_disk_random

gate:
  mass_drift_rel_max: 1.0e-10
  momentum_drift_rel_max: 1.0e-3
  energy_increase_tol_rel: 1.0e-3
  vram_peak_gb_max: 12.0
  step_time_scaling_tol: 1.5
  sphericity_min: 0.95
  sphericity_check_after_s: 600.0
  radius_drift_rel_max: 0.05
  radius_drift_check_after_s: 600.0
  max_speed_over_vrms: 10.0
  v15_R_drift_baseline: 0.244
  stage1a_plus_beta_alpha1_R_drift_baseline: 0.247
  stage1c_R_drift_baseline: 0.138
  stage1d_R_drift_baseline: 0.147
  stage2_R_drift_baseline: 0.127
  phase4_v1_pre_R_drift_baseline: 0.145
