# ============================================================================
# MCF7 single-cell PHYSIOLOGICAL-BASELINE manifest  (A2, H.7 — 2026-06-05)
# ============================================================================
# SINGLE source of truth for "what a resting physiological MCF7 single cell IS".
# Every compartment is declared here with its in-vivo setpoint and an explicit
# ON/OFF flag — no null/default-off physics (physiological-baseline HARD rule,
# CLAUDE.md PI 2026-06-04). Perturbations & measurements happen FROM this state.
#
# Loaded by ffn_sim/cell/manifest.py -> resolve_baseline() -> Cell.build (the
# A1-unified assembler). Values were externalised from the PI-ratified MCF7 dict
# in scripts/mcf7_fullcell_stage1.py (previously hardcoded in the driver).
#
# Citations are attached to each setpoint; none are tuning magic numbers.
# ============================================================================

cell_type: MCF7
R_cell: 7.5e-6            # m   cell radius, 15 um diameter (Wagner 2011)

# SCOPE (PI-RATIFIED 2026-06-06): model the cell as ACTIVE-SPREADING (primary),
# NOT a passive settled droplet. The emergent operating point arises from Arp2/3
# lamellipodial spreading + FA adhesion to the substrate. => lamellipodium + FA +
# substrate are B1-ESSENTIAL (see optional_subsystems), pending the KU-5.x
# membrane-load unblock (today lamellipodium barbed-end rates are inert at F=0).
scope: active_spreading

# Detailed H.3 cortex/myosin/crosslinker physics come from this base config;
# the manifest applies only MCF7 cell-type overrides + the R_cell above.
base_cortex_config: phase1_h3.yaml
# Production myosin = Route B (PI-ratified 2026-05-31; bug-fix confirmed 2026-06-07):
# grip_walk stepping + mesoscale_force_scaling ON. The ×40 mesoscopic coarse-graining
# reduces the MOTOR COUNT ~21× (native 3/µm²·4πR² → n_motors); without force-scaling the
# aggregate active stress is undercounted by that factor (the M1 diagnostic showed the
# active-γ ceiling jump 0.001→0.021 mN/m once ON, with N_eff·F_eff = N_native·F_native
# conserved exactly). binned_r0 (no scaling) stays the legacy-test default; physiological
# PRODUCTION must run Route B. (Scale n_filaments/n_xl still inherited; drivers MERGE.)
cortex_overrides:
  cortex:
    myosin:
      stepping_mode: grip_walk
      mesoscale_force_scaling: true     # areal_density_per_um2 defaults to 3.0 (Salbreux 2012)

# ----------------------------------------------------------------------------
# Compartments — ON at their physiological setpoint (the baseline IS this state)
# ----------------------------------------------------------------------------
compartments:

  cytoplasm:             # H.10 — effective-viscosity drag (Tier-1)
    enabled: true
    cell_type: MCF7      # -> eta_eff = 65.9 Pa.s (Hu 2024; NOT water 6.9e-4)

  enclosed_volume:       # KU-3.1 — osmotic turgor pre-tensions the cortex
    enabled: true
    turgor_dP0: 133.0    # Pa   B3 PI-RATIFIED 2026-06-06: band-implied turgor.
    # Derivation (not a fudge, grid-invariant): Young-Laplace Pi_0 = 2*gamma/R
    # with band-centre gamma = 0.50 mN/m at R = 7.5 um -> 133 Pa. The cortical-
    # tension band [0.35,0.65] mN/m implies Pi_0 in [93,173] Pa.
    # The cell is pressurised to THIS resting baseline; active myosin is then a
    # MODULATOR on top (physiological-baseline rule: measure tension on an
    # already-turgor-pressurised cell, then add myosin). GATE-B MUST report the
    # active vs passive(turgor) gamma DECOMPOSITION so an in-band total is not
    # mistaken for active-cortex closure. (Stewart 2011 interphase 40 Pa is the
    # lower alternative, superseded for the MCF7 baseline by this PI call.)

  nucleus:               # H.9 / KU-3.B2.1 — confinement + lamin strain-stiffening
    enabled: true
    E_nuc: 4700.0        # Pa   4.7 kPa MCF7 indentation, in-situ band [1e3,1e4]
    ratio_lamin: 1.4     # —    nucleus:cytoplasm stiffness, in-situ band min [1.4,5.0]
    R_nuc_frac: 0.25     # —    nucleus:cell radius ratio
    n_beads: 3000        # —    CFL-safe discretization at ratio_lamin=1.4 (k_hi ~ 1/n)

  membrane_surface:      # H.8 / KU-3.B1 — Young-Laplace area-elastic shell
    enabled: true
    gamma_mem: 1.0e-4    # N/m  0.10 mN/m, KU-3.B1 mid-band

# ----------------------------------------------------------------------------
# Optional subsystems — coded but PI-GATED. Declared here for completeness so
# the manifest is the one place that lists the whole cell. They stay OFF until
# their gate clears (Phase B / GATE-B); enabling one via the loader currently
# raises (surface to PI) rather than silently wiring un-ratified physics.
# ----------------------------------------------------------------------------
optional_subsystems:

  fa:                    # H.4 focal-adhesion clutch to substrate ligands
    enabled: false       # WIREABLE + clutches auto-form (south-cap seeding, 52/52);
    base_config: phase1_h4.yaml  # SubstrateLigandPin = rigid-dish adhesion (no k_sub).
                         # OFF in the RESTING reference: the FA-adhered build needs an
                         # EQUILIBRATION prelude to settle onto the substrate before
                         # free integration (a raw run blows up the BAOAB guard — the
                         # cell isn't born relaxed-on-substrate). The KU-3.5 SETTLED
                         # operating point = this FA-adhered cell AFTER equilibration
                         # (the GATE-B operating-point build). PI 2026-06-06: KU-3.5
                         # needs adhesion, NOT the lamellipodium (cortex tension is a
                         # cortex property; lamellipodium is a parallel enhancement).
  substrate:             # ECM compliant substrate spring (paired with FA)
    enabled: false       # OFF — and for the PI's experimental prep it stays OFF by
                         # PHYSICS, not by missing data. Prep = col-I 167 µl : 5 ml PBS,
                         # 1 h on a glass-bottom confocal dish = a thin 2D LIGAND coating
                         # (dilute in PBS, NOT a gelled 3D collagen). Glass E ~ 64-70 GPa
                         # (orders of mag > ECM); a thin col-I coating's mechanical effect
                         # is negligible vs the bulk -> cells perceive RIGID. In the
                         # Chan-Odde clutch (k_sub ~ 1 pN/nm per kPa) glass -> k_sub
                         # ~1e6 pN/nm = rigid limit. => use FA's rigid SubstrateLigandPin
                         # (the (b)-dish endpoint, k_sub->inf); a FINITE compliant k_sub is
                         # only for defined soft gels (kPa PAA), a SEPARATE ECM variant.
                         # (Chan & Odde 2008; Elosegui-Artola 2016; glass-GPa: Sigma/PMC.)
  lamellipodium:         # H.5 Arp2/3 leading edge — the active-spreading machine
    enabled: false       # OFF: NOT a KU-3.5 blocker (PI 2026-06-06). Active-spreading
    base_config: phase1_h5.yaml  # enhancement; spherical-cortex geometry below.
    geometry: basal_ring # DEFAULT (PI 2026-06-07): single-cell isotropic spreading rim.
                         # polarized_patch is a SEPARATE migration condition (use only when
                         # the PI assay is directed migration); set geometry: polarized_patch
                         # (+ polarization) for that condition.
  membrane_load:         # KU-5.2 leading-edge Brownian-ratchet brake on barbed ends
    enabled: false       # KU-5.x PI-APPROVED 2026-06-06; wires when lamellipodium is on
                         # (loads its barbed ends; y_plane=Y_max, A_mem=wave_area).
  erm:                   # KU-3.18 ezrin/radixin/moesin membrane-cortex tether
    enabled: false       # declarable, Phase B2 wire-on
  turnover:              # cortex actin cofilin severing / re-annealing
    enabled: false       # Phase B; k_sev = ln2/tau_half (Chugh 2017 anchor)
