# params_manifest.yaml — the declarative contract of headline SIMULATION CONSTANTS.
#
# The PARAMETERS-side twin of the SourceEvidence citation list (verify_sources.py)
# and the headline-results list (results_manifest.yaml / verify_runs.py). This is
# what operationalizes the project's HARD rule "no empirical magic numbers — every
# tuning constant traces to a literature source": each production constant the
# simulator actually runs on is declared here with WHERE it lives on disk, its
# value, its KU anchor, and the SourceEvidence citation_key that anchors it.
# verify_params.py checks each against DISK + the committed citation audit:
#   1. the declared value MATCHES the value in the actual config YAML on disk
#      (anti-drift: a constant silently changed away from its sourced value = RED);
#   2. the constant carries a KU tag and a declared citation_key (else UNSOURCED);
#   3. that citation_key's audit verdict (source_audit_report.md, committed) is OK
#      (else SOURCE_UNVERIFIED / SOURCE_SUSPECT — a constant anchored to an
#      unverified or fabrication-risk source).
# DISK OVERRIDES THE CLAIM — verify_params can only DOWNGRADE an over-stated
# declaration, never upgrade it. A claim whose disk verdict is WORSE than declared
# is a DRIFT and FAILS the CI gate. Honestly-declared pending constants
# (declared == disk: unsourced / source-unverified) stay GREEN.
#
# Fields:
#   id            stable claim id
#   desc          one line
#   config        repo-root-relative path to the config YAML where the constant lives
#   key           dotted path into that YAML (e.g. cell.gamma_cortex)
#   value         the declared SI value (must equal the on-disk value within tol)
#   unit          SI unit (documentation)
#   ku            the KnowledgeClaim anchor tagged in the config comment (KU-x.y)
#   citation_key  the SourceEvidence row that anchors it (null = KU->source link
#                 not yet committed; honestly declared unsourced until filled)
#   declared      honest current status: verified | source-unverified | source-suspect
#                 | unsourced | value-drift  (verify_params DOWNGRADES if disk is worse)
#   tol           optional absolute tolerance for the value check (default: |value|*1e-9)
#
# To claim a NEW constant as fully sourced: add it here with a citation_key whose
# audit verdict is OK and declared: verified. If the citation is only CHECK/NO_DOI
# or the value drifts from disk, the gate downgrades it and (if you over-declared)
# goes RED until you correct the declaration or re-anchor the source.
#
# NOTE on the KU->citation_key links below: each is taken from the config's OWN
# provenance comment (e.g. dx_star_phase1 "Bell 1978 lower bound", talin "del Rio
# 2009", catch-slip "Pereverzev"), matched to the committed source_audit_report.md
# citation_key — NOT guessed. Constants whose config names no paper are left
# citation_key: null and declared unsourced (the honest KU->source backlog).

claims:
  # --- fully sourced (citation verdict OK on disk) ---
  - id: P1-junction-dx-star-phase1
    desc: "E-cadherin Bell-Evans transition-state distance, Phase-1 baseline (Bell 1978 slip-bond lower bound)"
    config: ffn_sim/validation/oracles/configs/phase1_unit4_1.yaml
    key: junction.dx_star_phase1
    value: 0.1e-9
    unit: m
    ku: KU-4.17
    citation_key: Bell1978_Science
    declared: verified

  - id: P2-junction-dx-star-ku417
    desc: "E-cadherin transition-state distance, KU-4.17 literal (Buckley 2014 minimal cadherin-catenin complex)"
    config: ffn_sim/validation/oracles/configs/phase1_unit4_1.yaml
    key: junction.dx_star_ku417
    value: 4.0e-9
    unit: m
    ku: KU-4.17
    citation_key: Buckley2014_Science
    declared: verified

  - id: P3-talin-unfold-rate
    desc: "Talin resting unfold rate k_u0 (Bell-Evans 1-state, del Rio 2009 talin rod stretching)"
    config: ffn_sim/validation/oracles/configs/phase1_unit2_2.yaml
    key: bridge.talin.k_u0
    value: 0.01
    unit: s^-1
    ku: KU-2.6
    citation_key: DelRio2009_Science
    declared: verified

  - id: P8-talin-dx-star
    desc: "Talin Bell-Evans transition-state distance dx_star (del Rio 2009, same anchor as k_u0)"
    config: ffn_sim/validation/oracles/configs/phase1_unit2_2.yaml
    key: bridge.talin.dx_star
    value: 1.5e-9
    unit: m
    ku: KU-2.6
    citation_key: DelRio2009_Science
    declared: verified

  # --- sourced but citation NOT confirmed-OK (honestly declared source-unverified) ---
  - id: P4-cortex-gamma
    desc: "Cortex active+passive surface tension gamma_cortex (KU-3.5 mid-range; THE gamma-floor parameter)"
