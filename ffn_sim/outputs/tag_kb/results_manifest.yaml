# results_manifest.yaml — the declarative contract of headline RESULT-claims.
#
# The RESULTS-side twin of the SourceEvidence citation list. Every "done /
# breakthrough / validated" result the project leans on is declared here with
# its artifact, metric, and HONEST status; verify_runs.py checks each against
# DISK. A result is "done" only when its verdict is VERIFIED. Declaring a claim
# with no committed artifact, or with the PI-forbidden basal-footprint A/A0
# metric, makes the CI gate RED — by design. This is what stops the 2026-06-19
# drift class (PNG-title numbers, forbidden-metric REPORTs, prose-inflated
# speedups that the RAG/TAG citation audit could never catch).
#
# Fields:
#   id        cross-ref to the 2026-06-19 grounding pass (Cxx) where applicable
#   desc      one line
#   artifact  repo-root-relative path to the committed evidence
#   metric    top-down-silhouette (sanctioned) | basal-contact-hull (FORBIDDEN) | n/a
#   expect    {field: <dotted.json.path>, value: <num>, tol: <num>}  (optional; .json only)
#   repro     cpu (independently reproducible) | gpu (gbook-only, no build/CI trace)
#   declared  honest current status: verified | gpu-unreproduced | needs-regen | retract
#             verify_runs DOWNGRADES this if disk is worse; a DRIFT = CI gate failure.
#
# To claim a NEW result as done: add it here with declared: verified + a committed
# artifact (+ an expect block if it is JSON). If the artifact is absent or the
# number is only in a figure title, the gate stays red until you regenerate+commit.

claims:
  # --- GPU-only, present + internally consistent (value-checked from committed JSON) ---
  - id: C2-compartment-speedup
    desc: "Full GPU-main stack 5.86x vs cupy (native integrator + compartment forces)"
    artifact: ffn_sim/outputs/h7/production/h7_compartment_gpu_port.json
    metric: n/a
    expect: {field: speedups_vs_cupy_cpucomp.native_gpucomp, value: 5.864, tol: 0.01}
    repro: gpu
    declared: gpu-unreproduced

  - id: C3-fullcell-speedup
    desc: "Native full-cell 2.43x vs cupy at the real op point (201 steps/s = 11.5d/2e8)"
    artifact: ffn_sim/outputs/h7/production/h7_native_fullcell_go.json
    metric: n/a
    expect: {field: end_to_end_speedup_native_over_cupy, value: 2.4325, tol: 0.01}
    repro: gpu
    declared: gpu-unreproduced

  # The gate flagged this on its first CI run (2026-06-19): the bulk .pkl is
  # gitignored run-data (Syncthing/outputs, NOT version-controlled), so it is
  # ABSENT in the canonical repo checkout -> a "present" claim was unverifiable.
  # Lesson encoded: a result-claim must reference a COMMITTED lightweight artifact
  # (a top-down-A/A0 summary JSON), not an uncommitted bulk pkl. Down-declared to
  # needs-regen until that summary is committed.
  - id: C12-dcm-compaction
    desc: "DCM full mechanistic spheroid COMPACTS top-down (A/A0->0.597) — confirmed manually, but evidence pkl is gitignored; needs a committed top-down summary JSON"
    artifact: ffn_sim/outputs/h_dcm_two_stage/two_stage_n400_topdown_summary.json
    metric: top-down-silhouette
    declared: needs-regen

  # --- RETRACT: forbidden metric (the 2026-06-19 C14 finding, encoded so it can't recur) ---
  - id: C14-dcm-footprint-report
    desc: "DCM REPORT 'spreading footprint' headline — RETRACTED (basal-footprint is forbidden)"
    artifact: ffn_sim/outputs/h_dcm_two_stage/REPORT.md
    metric: basal-contact-hull
    declared: retract

  # --- NEEDS_REGEN: claimed but no committed data (numbers lived only in PNG titles) ---
  - id: C13-cleanball-187
    desc: "clean-ball A/A0 1.0->1.87 'breakthrough' — no committed pkl (PNG title only)"
    artifact: ffn_sim/outputs/h_dcm_two_stage/cleanball_n12.pkl
    metric: top-down-silhouette
    declared: needs-regen

  - id: C17-aa0-fit
    desc: "A/A0=a+b/R+c/R^2 fit r^2=0.96 — underlying cleanball data absent (PNG legend only)"
    artifact: ffn_sim/outputs/h_dcm_two_stage/cleanball_aa0_fit.json
    metric: top-down-silhouette
    declared: needs-regen

  # --- Warp port (Phase B) — CPU-reproducible bit-parity vs committed HOOMD reference ---
  # Each Warp piece is "done" ONLY when its committed pytest parity test passes
  # against a committed HOOMD reference fixture; this records the lightweight,
  # committed parity-result JSON the gate enforces. repro: cpu (Warp CPU backend
  # — independently re-runnable: warp_port/parity_report.py). Verified by
  # tests/warp_port/test_baoab_warp_parity.py against
  # warp_port/fixtures/baoab_ref_*.npz (frozen LeimkuhlerMatthewsBAOAB output).
  - id: warp-B1-baoab-kt0
    desc: "Warp overdamped L-M BAOAB step kT=0 bit-for-bit vs frozen HOOMD Action (triclinic box, image flags)"
    artifact: ffn_sim/warp_port/fixtures/warp_parity_results.json
    metric: n/a
    expect: {field: B1_baoab.kt0.max_abs_pos_diff, value: 0.0, tol: 1.0e-9}
    repro: cpu
    declared: verified

  - id: warp-B1-baoab-ktpos
    desc: "Warp overdamped L-M BAOAB step kT>0 drift vs frozen HOOMD Action (identical injected noise)"
    artifact: ffn_sim/warp_port/fixtures/warp_parity_results.json
    metric: n/a
    expect: {field: B1_baoab.ktpos.max_abs_pos_diff, value: 0.0, tol: 1.0e-7}
    repro: cpu
    declared: verified

  # B2 radial-shell compartment force (3 laws). Verified by
  # tests/warp_port/test_radial_shell_warp_parity.py vs radial_ref_*.npz (the
  # real NucleusConfinement / MembraneSurfaceTension / EnclosedVolumePressure
  # forces run in HOOMD). Gated on the host-reduced FORCE-LAW rel error < 1e-12
  # (the full atomic-reduction port matches to ~2.6e-12 = reduction-order, < the
  # native plugin's own 1e-8 — recorded as *_warp_* fields, not gated here).
  - id: warp-B2-radial-nucleus
    desc: "Warp radial-shell nucleus bilinear-confinement force-law bit-parity vs HOOMD NucleusConfinement"
    artifact: ffn_sim/warp_port/fixtures/warp_parity_results.json
    metric: n/a
    expect: {field: B2_radial_shell.nucleus.host_force_rel, value: 0.0, tol: 1.0e-12}
    repro: cpu
    declared: verified

  - id: warp-B2-radial-membrane
    desc: "Warp radial-shell membrane Laplace-tension force-law parity vs HOOMD MembraneSurfaceTension"
    artifact: ffn_sim/warp_port/fixtures/warp_parity_results.json
    metric: n/a
    expect: {field: B2_radial_shell.membrane.host_force_rel, value: 0.0, tol: 1.0e-12}
    repro: cpu
    declared: verified

  - id: warp-B2-radial-turgor
    desc: "Warp radial-shell turgor osmotic-pressure force-law parity vs HOOMD EnclosedVolumePressure"
    artifact: ffn_sim/warp_port/fixtures/warp_parity_results.json
    metric: n/a
    expect: {field: B2_radial_shell.turgor.host_force_rel, value: 0.0, tol: 1.0e-12}
    repro: cpu
    declared: verified

  # M-SHAKE chain constraint projection (rigid Matrix-SHAKE, one thread/chain).
  # Verified by tests/warp_port/test_shake_warp_parity.py vs shake_ref.npz (the
  # committed shake_project_chains output). Iterative solver → not bit-for-bit
  # (Warp FMA vs numpy converges to a slightly different valid manifold point);
  # gated on relative position agreement < 1e-9 (well under the native 1e-8) +
  # constraint satisfaction + zero nonconvergence.
  - id: warp-MSHAKE-chain-constraint
    desc: "Warp Matrix-SHAKE rigid chain-constraint projection parity vs HOOMD shake_project_chains (pos rel + nonconv=0)"
    artifact: ffn_sim/warp_port/fixtures/warp_parity_results.json
    metric: n/a
    expect: {field: MSHAKE_chain_constraint.pos_rel, value: 0.0, tol: 1.0e-9}
    repro: cpu
    declared: verified

  # Fixman metric pseudo-force (tridiagonal continuant for ln det G + G^-1).
  # Verified by tests/warp_port/test_fixman_warp_parity.py vs fixman_ref.npz (the
  # committed fixman_logdet_and_force LAPACK output). Tolerance-based (continuant
  # vs LAPACK differ in last ULPs); gated on the native contract force rel < 1e-7
  # (achieved ~6e-16). Force is what feeds the dynamics.
  - id: warp-Fixman-metric-force
    desc: "Warp Fixman metric pseudo-force (continuant ln det G) parity vs HOOMD fixman_logdet_and_force"
    artifact: ffn_sim/warp_port/fixtures/warp_parity_results.json
    metric: n/a
    expect: {field: Fixman_metric_force.force_rel, value: 0.0, tol: 1.0e-7}
    repro: cpu
    declared: verified

  # B4 differentiability (Warp's prize — native CUDA plugin has no autodiff).
  # Reverse-mode grad of the membrane force-law loss w.r.t. gamma_mem vs the
  # closed-form analytic grad. Verified by tests/warp_port/test_warp_differentiability.py.
  - id: warp-B4-differentiability
    desc: "Warp reverse-mode autodiff through the membrane force law matches the analytic gradient (~machine eps)"
    artifact: ffn_sim/warp_port/fixtures/warp_parity_results.json
    metric: n/a
    expect: {field: B4_differentiability.rel_err_vs_analytic, value: 0.0, tol: 1.0e-9}
    repro: cpu
    declared: verified
