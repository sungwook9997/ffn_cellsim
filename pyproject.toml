[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ffn_cellsim"
version = "0.0.1.dev0"
description = "Full Fiber Network Cell Simulator — fine-grained, mechanistic HOOMD-blue framework"
requires-python = ">=3.13"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["ffn_sim*"]
exclude = ["ffn_sim.outputs*", "ffn_sim.docs*"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["ffn_sim/outputs", "ffn_sim/docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.pytest.ini_options]
testpaths = ["ffn_sim/tests"]
addopts = "-ra -q"
